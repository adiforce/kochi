<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>日本家計簿</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Zen+Maru+Gothic:wght@400;500;700&family=Noto+Sans+TC:wght@400;500;700&display=swap" rel="stylesheet" />
  <style>
    :root {
      --cream: #f3f5f8;
      --pink: #c9dcf0;
      --pink-dark: #2f6fb3;
      --brown: #1f3350;
      --border: #d6dee8;
      --white: #fff;
      --shadow: rgba(31,51,80, 0.08);
      --green: #7bbf6a;
      --red: #d9534f;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: var(--cream);
      font-family: 'Noto Sans TC', sans-serif;
      color: var(--brown);
      min-height: 100dvh;
      padding-bottom: 40px;
    }
    /* ── 頁首 ── */
    header {
      background: var(--white);
      border-bottom: 2px solid var(--border);
      padding: 14px 18px 12px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      position: sticky;
      top: 0;
      z-index: 100;
    }
    header .logo {
      font-family: 'Zen Maru Gothic', sans-serif;
      font-size: 20px;
      font-weight: 700;
      color: var(--pink-dark);
      letter-spacing: 0.04em;
    }
    header .logo span { color: var(--brown); font-size: 13px; margin-left: 6px; font-weight: 400; }
    .lock-icon-btn {
      flex-shrink: 0;
      border: 1.5px solid var(--border);
      background: var(--cream);
      color: var(--brown);
      border-radius: 10px;
      font-size: 16px;
      width: 36px;
      height: 36px;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
    }
    .lock-icon-btn.unlocked { color: var(--green); border-color: var(--green); }
    /* ── 密碼遮罩層 ── */
    #lockOverlay {
      position: fixed;
      inset: 0;
      background: rgba(31,51,80, 0.45);
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 500;
      padding: 20px;
    }
    #lockOverlay.hidden { display: none; }
    .lock-modal {
      background: var(--white);
      border-radius: 18px;
      padding: 26px 22px 22px;
      max-width: 320px;
      width: 100%;
      box-shadow: 0 8px 24px rgba(31,51,80, 0.25);
      text-align: center;
    }
    .lock-modal .lm-icon { font-size: 34px; margin-bottom: 8px; }
    .lock-modal .lm-title {
      font-family: 'Zen Maru Gothic', sans-serif;
      font-size: 16px;
      font-weight: 700;
      color: var(--pink-dark);
      margin-bottom: 4px;
    }
    .lock-modal .lm-sub {
      font-size: 12px;
      color: var(--brown);
      opacity: 0.6;
      margin-bottom: 16px;
    }
    .lock-modal input {
      width: 100%;
      padding: 12px 14px;
      border: 1.5px solid var(--border);
      border-radius: 10px;
      background: var(--cream);
      font-family: 'Noto Sans TC', sans-serif;
      font-size: 18px;
      text-align: center;
      letter-spacing: 0.15em;
      color: var(--brown);
      outline: none;
      margin-bottom: 8px;
    }
    .lock-modal input:focus { border-color: var(--pink-dark); }
    .lm-error {
      font-size: 12px;
      color: var(--red);
      min-height: 16px;
      margin-bottom: 8px;
      font-weight: 500;
    }
    .lm-confirm-btn {
      width: 100%;
      padding: 12px;
      border: none;
      border-radius: 12px;
      background: var(--pink-dark);
      color: #fff;
      font-family: 'Zen Maru Gothic', sans-serif;
      font-size: 15px;
      font-weight: 700;
      cursor: pointer;
      margin-bottom: 8px;
      transition: background 0.15s, transform 0.1s;
    }
    .lm-confirm-btn:active { background: var(--brown); transform: scale(0.98); }
    .lm-skip-btn {
      width: 100%;
      padding: 10px;
      border: none;
      background: none;
      color: var(--brown);
      opacity: 0.55;
      font-size: 13px;
      font-weight: 500;
      cursor: pointer;
      text-decoration: underline;
    }
    /* ── 卡片 ── */
    .card {
      background: var(--white);
      border: 1.5px solid var(--border);
      border-radius: 16px;
      padding: 16px;
      margin: 14px 14px 0;
      box-shadow: 0 2px 8px var(--shadow);
    }
    .card-title {
      font-family: 'Zen Maru Gothic', sans-serif;
      font-size: 13px;
      font-weight: 700;
      color: var(--pink-dark);
      margin-bottom: 12px;
      letter-spacing: 0.06em;
      text-transform: uppercase;
    }
    /* ── 表單 ── */
    .row { display: flex; gap: 8px; margin-bottom: 10px; }
    .row:last-child { margin-bottom: 0; }
    label {
      font-size: 11px;
      font-weight: 500;
      color: var(--brown);
      opacity: 0.7;
      display: block;
      margin-bottom: 4px;
      letter-spacing: 0.04em;
    }
    input, select {
      width: 100%;
      padding: 10px 12px;
      border: 1.5px solid var(--border);
      border-radius: 10px;
      background: var(--cream);
      font-family: 'Noto Sans TC', sans-serif;
      font-size: 15px;
      color: var(--brown);
      outline: none;
      -webkit-appearance: none;
      appearance: none;
      transition: border-color 0.18s;
    }
    input:focus, select:focus { border-color: var(--pink-dark); }
    /* 日期 */
    .date-group { display: flex; gap: 6px; align-items: flex-end; }
    .date-sep { font-size: 18px; color: var(--pink-dark); padding-bottom: 8px; font-weight: 700; }
    .date-m input { width: 60px; text-align: center; }
    .date-d input { width: 60px; text-align: center; }
    /* JPY 累加器 */
    .jpy-row { display: flex; gap: 6px; }
    .jpy-row input { flex: 1; }
    .add-btn {
      flex-shrink: 0;
      width: 44px;
      height: 44px;
      border-radius: 10px;
      border: none;
      background: var(--pink-dark);
      color: #fff;
      font-size: 22px;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      transition: background 0.15s, transform 0.1s;
      line-height: 1;
    }
    .add-btn:active { background: var(--brown); transform: scale(0.95); }
    .chips {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      margin-top: 8px;
      min-height: 0;
    }
    .chip {
      background: var(--pink);
      color: var(--brown);
      border-radius: 20px;
      padding: 4px 10px 4px 12px;
      font-size: 13px;
      font-weight: 500;
      display: flex;
      align-items: center;
      gap: 4px;
      cursor: pointer;
      transition: background 0.15s;
    }
    .chip:active { background: var(--pink-dark); color: #fff; }
    .chip .x { font-size: 15px; opacity: 0.6; }
    .subtotal {
      font-size: 12px;
      color: var(--pink-dark);
      margin-top: 6px;
      font-weight: 500;
      min-height: 18px;
    }
    /* 類別格子 */
    .cat-grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 6px;
    }
    .cat-btn {
      border: 1.5px solid var(--border);
      border-radius: 10px;
      background: var(--cream);
      color: var(--brown);
      font-family: 'Zen Maru Gothic', sans-serif;
      font-size: 13px;
      font-weight: 700;
      padding: 8px 4px 6px;
      cursor: pointer;
      transition: all 0.15s;
      text-align: center;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 2px;
    }
    .cat-btn .btn-icon { font-size: 18px; line-height: 1; }
    .cat-btn .btn-label { font-size: 12px; }
    .cat-btn.active {
      background: var(--pink-dark);
      border-color: var(--pink-dark);
      color: #fff;
    }
    /* 付款 */
    .pay-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 6px;
    }
    .pay-btn {
      border: 1.5px solid var(--border);
      border-radius: 10px;
      background: var(--cream);
      color: var(--brown);
      font-family: 'Noto Sans TC', sans-serif;
      font-size: 11px;
      font-weight: 500;
      padding: 8px 6px 6px;
      cursor: pointer;
      transition: all 0.15s;
      text-align: center;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 2px;
    }
    .pay-btn .btn-icon { font-size: 18px; line-height: 1; }
    .pay-btn .btn-label { font-size: 11px; }
    .pay-btn.active {
      background: var(--pink-dark);
      border-color: var(--pink-dark);
      color: #fff;
    }
    /* 額外支出（屁孩/EN） */
    .extra-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
    }
    /* 送出按鈕 */
    .submit-btn {
      width: 100%;
      padding: 14px;
      border-radius: 12px;
      border: none;
      background: var(--pink-dark);
      color: #fff;
      font-family: 'Zen Maru Gothic', sans-serif;
      font-size: 16px;
      font-weight: 700;
      cursor: pointer;
      letter-spacing: 0.06em;
      transition: background 0.15s, transform 0.1s;
    }
    .submit-btn:active { background: var(--brown); transform: scale(0.98); }
    .submit-btn:disabled { opacity: 0.5; cursor: not-allowed; }
    /* Toast */
    #toast {
      position: fixed;
      bottom: 24px;
      left: 50%;
      transform: translateX(-50%) translateY(20px);
      background: var(--brown);
      color: #fff;
      font-size: 13px;
      font-weight: 500;
      padding: 9px 20px;
      border-radius: 20px;
      opacity: 0;
      transition: opacity 0.25s, transform 0.25s;
      pointer-events: none;
      white-space: nowrap;
      z-index: 999;
    }
    #toast.show {
      opacity: 1;
      transform: translateX(-50%) translateY(0);
    }
    /* ── 紀錄列表 ── */
    .list-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 10px;
    }
    .list-total {
      font-family: 'Zen Maru Gothic', sans-serif;
      font-size: 15px;
      font-weight: 700;
      color: var(--pink-dark);
    }
    .list-total small { font-size: 11px; font-weight: 400; color: var(--brown); opacity: 0.6; margin-right: 2px; }
    .record-item {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 10px 0;
      border-bottom: 1px solid var(--border);
      animation: fadeIn 0.25s ease;
    }
    .record-item:last-child { border-bottom: none; }
    @keyframes fadeIn { from { opacity: 0; transform: translateY(4px); } to { opacity: 1; transform: none; } }
    .rec-date {
      font-size: 11px;
      font-weight: 500;
      color: var(--brown);
      opacity: 0.55;
      min-width: 34px;
      text-align: center;
    }
    .rec-cat {
      font-family: 'Zen Maru Gothic', sans-serif;
      font-size: 12px;
      font-weight: 700;
      background: var(--pink);
      color: var(--brown);
      border-radius: 8px;
      padding: 2px 7px;
      white-space: nowrap;
    }
    .rec-name {
      flex: 1;
      font-size: 14px;
      font-weight: 500;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    .rec-main {
      flex: 1;
      min-width: 0;
    }
    .rec-extra {
      font-size: 10px;
      color: var(--brown);
      opacity: 0.5;
      margin-top: 2px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .rec-amounts {
      text-align: right;
      min-width: 62px;
    }
    .rec-jpy {
      font-family: 'Zen Maru Gothic', sans-serif;
      font-size: 14px;
      font-weight: 700;
      color: var(--brown);
    }
    .rec-twd {
      font-size: 10px;
      color: var(--brown);
      opacity: 0.45;
    }
    .del-btn {
      width: 28px;
      height: 28px;
      border-radius: 8px;
      border: 1.5px solid var(--border);
      background: var(--cream);
      color: var(--pink-dark);
      font-size: 14px;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      flex-shrink: 0;
      transition: background 0.15s;
    }
    .del-btn:active { background: var(--pink-dark); color: #fff; border-color: var(--pink-dark); }
    .loading-msg { text-align: center; font-size: 13px; color: var(--brown); opacity: 0.45; padding: 18px 0; }
    /* Select 箭頭 */
    .select-wrap { position: relative; }
    .select-wrap::after {
      content: '▾';
      position: absolute;
      right: 12px;
      top: 50%;
      transform: translateY(-50%);
      color: var(--pink-dark);
      pointer-events: none;
      font-size: 14px;
    }
    .select-wrap select { padding-right: 28px; }
    /* 分隔 */
    .field-group { margin-bottom: 10px; }
    .field-group:last-child { margin-bottom: 0; }
    /* ── 分頁 Tab ── */
    .tabs {
      display: flex;
      background: var(--white);
      border-bottom: 2px solid var(--border);
      position: sticky;
      top: 52px;
      z-index: 99;
    }
    .tab-btn {
      flex: 1;
      padding: 11px 0;
      border: none;
      background: none;
      font-family: 'Zen Maru Gothic', sans-serif;
      font-size: 14px;
      font-weight: 700;
      color: var(--brown);
      opacity: 0.4;
      cursor: pointer;
      border-bottom: 3px solid transparent;
      margin-bottom: -2px;
      transition: opacity 0.15s, border-color 0.15s;
      letter-spacing: 0.04em;
    }
    .tab-btn.active {
      opacity: 1;
      border-bottom-color: var(--pink-dark);
      color: var(--pink-dark);
    }
    /* ── 頁面區塊 ── */
    .page { display: none; padding-bottom: 40px; }
    .page.active { display: block; }
    /* ── 暫存匣 ── */
    .tab-badge {
      display: inline-block;
      min-width: 17px;
      padding: 0 5px;
      margin-left: 3px;
      border-radius: 9px;
      background: var(--red);
      color: #fff;
      font-size: 10.5px;
      line-height: 17px;
      vertical-align: 1px;
    }
    .tab-badge:empty { display: none; }
    .inbox-hint { font-size: 11.5px; opacity: 0.6; line-height: 1.6; margin-bottom: 4px; }
    .inbox-card { position: relative; }
    .inbox-head {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-bottom: 10px;
      font-size: 11.5px;
    }
    .src-tag {
      padding: 2px 8px;
      border-radius: 8px;
      font-weight: 700;
      background: var(--pink);
      color: var(--pink-dark);
    }
    .src-tag.cart { background: #e3f1dc; color: #3f7d31; }
    .inbox-time { opacity: 0.5; flex: 1; }
    .inbox-row { display: grid; grid-template-columns: 74px 1fr; gap: 8px; margin-bottom: 8px; }
    .inbox-row.date { grid-template-columns: 1fr 14px 1fr 2fr; align-items: center; }
    .inbox-card input[type=text], .inbox-card input[type=number] { margin-top: 0; }
    .inbox-row .date-sep { padding: 0; margin: 0; text-align: center; align-self: center; }
    .detail-box {
      border: 1.5px dashed var(--border);
      border-radius: 10px;
      padding: 6px 10px;
      margin-bottom: 10px;
      font-size: 12px;
    }
    .detail-box summary { cursor: pointer; font-weight: 700; color: var(--pink-dark); padding: 2px 0; }
    .detail-line { display: flex; align-items: center; gap: 8px; padding: 4px 0; margin: 0; border-top: 1px solid var(--cream); font-size: 12px; opacity: 1; letter-spacing: 0; cursor: pointer; }
    .detail-line input { width: auto; margin: 0; min-height: 0; }
    .detail-line .dl-name { flex: 1; line-height: 1.35; }
    .detail-line .dl-name small { opacity: 0.5; display: block; font-size: 10.5px; }
    .detail-line.off .dl-name, .detail-line.off .dl-jpy { opacity: 0.35; text-decoration: line-through; }
    .inbox-card .cat-grid, .inbox-card .pay-grid { margin-bottom: 10px; }
    .inbox-missing { font-size: 11.5px; color: var(--red); margin: 2px 0 8px; min-height: 0; }
    .inbox-card .submit-btn { padding: 11px; font-size: 15px; }
  </style>
<link rel="icon" href="favicon.ico" sizes="any">
<link rel="icon" type="image/png" sizes="32x32" href="favicon-32.png">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="theme-color" content="#2f6fb3">
</head>
<body>
<script src="doodle-icons.js"></script>
<script src="kakeibo-inbox.js"></script>
<header>
  <div class="logo">🇯🇵 家計簿<span>Japan Trip</span></div>
  <button class="lock-icon-btn" id="lockIconBtn" onclick="openLockOverlay()" title="輸入密碼解鎖">🔒</button>
</header>
<div class="tabs">
  <button class="tab-btn active" data-tab="form" onclick="switchTab('form')">✏️ 記帳</button>
  <button class="tab-btn" data-tab="inbox" onclick="switchTab('inbox')">📥 暫存<span class="tab-badge" id="inboxBadge"></span></button>
  <button class="tab-btn" data-tab="list" onclick="switchTab('list')">📋 紀錄</button>
</div>
<!-- ── 記帳表單頁 ── -->
<div class="page active" id="page-form">
<div class="card">
  <div class="card-title">✏️ 新增支出</div>
  <!-- 日期 -->
  <div class="field-group">
    <label>日期</label>
    <div class="date-group">
      <div class="date-m"><input type="number" id="inputMonth" min="1" max="12" placeholder="月" /></div>
      <div class="date-sep">/</div>
      <div class="date-d"><input type="number" id="inputDay" min="1" max="31" placeholder="日" /></div>
    </div>
  </div>
  <!-- 品項名稱 -->
  <div class="field-group">
    <label>品項名稱</label>
    <input type="text" id="inputName" placeholder="例：藥妝店、便利商店…" />
  </div>
  <!-- JPY 金額 -->
  <div class="field-group">
    <label>金額（¥ 日圓）</label>
    <div class="jpy-row">
      <input type="number" id="inputJpy" placeholder="輸入金額" inputmode="numeric" />
      <button class="add-btn" onclick="addChip()" title="＋">＋</button>
    </div>
    <div class="chips" id="chips"></div>
    <div class="subtotal" id="subtotal"></div>
  </div>
  <!-- 類別 -->
  <div class="field-group">
    <label>類別</label>
    <div class="cat-grid" id="catGrid"></div>
  </div>
  <!-- 付款工具 -->
  <div class="field-group">
    <label>付款工具</label>
    <div class="pay-grid" id="payGrid"></div>
  </div>
  <!-- 屁孩支出 / EN支出 -->
  <div class="field-group">
    <label>額外分攤（¥ 日圓，預設 0）</label>
    <div class="extra-grid">
      <div>
        <label style="opacity:1;font-weight:700;color:var(--pink-dark)">HAO支出</label>
        <input type="number" id="inputKid" placeholder="0" inputmode="numeric" value="0" />
      </div>
      <div>
        <label style="opacity:1;font-weight:700;color:var(--pink-dark)">它人支出</label>
        <input type="number" id="inputEn" placeholder="0" inputmode="numeric" value="0" />
      </div>
    </div>
  </div>
  <button class="submit-btn" id="submitBtn" onclick="submitRecord()" disabled>記帳 ✓</button>
</div>
</div><!-- end page-form -->
<!-- ── 紀錄列表頁 ── -->
<div class="page" id="page-list">
<div class="card">
  <div class="list-header">
    <div class="card-title" style="margin-bottom:0">消費紀錄</div>
    <div class="list-total" id="listTotal"></div>
  </div>
  <div id="recordList"><div class="loading-msg">讀取中…</div></div>
</div>
</div><!-- end page-list -->
<!-- ── 暫存匣頁 ── -->
<div class="page" id="page-inbox">
<div class="card">
  <div class="card-title">📥 待入檔</div>
  <div class="inbox-hint">從「發票解析」和「日幣換算」送過來的資料會先放這裡，補完類別、付款工具後再入檔；不要的直接捨棄。</div>
</div>
<div id="inboxList"></div>
</div><!-- end page-inbox -->
<div id="toast"></div>
<!-- ── 進站密碼遮罩層 ── -->
<div id="lockOverlay">
  <div class="lock-modal">
    <div class="lm-icon">🔒</div>
    <div class="lm-title">請輸入密碼</div>
    <div class="lm-sub">輸入正確密碼才能記帳與刪除紀錄</div>
    <input type="password" id="inputPwd" placeholder="請輸入密碼" inputmode="numeric" maxlength="4" autocomplete="off" />
    <div class="lm-error" id="lmError"></div>
    <button class="lm-confirm-btn" onclick="confirmPassword()">確認</button>
    <button class="lm-skip-btn" onclick="skipPassword()">先跳過（僅能瀏覽，無法記帳／刪除）</button>
  </div>
</div>
<script>
// ── 分頁切換 ──
function switchTab(tab) {
  document.querySelectorAll('.tab-btn').forEach(b => b.classList.toggle('active', b.dataset.tab === tab));
  ['form', 'inbox', 'list'].forEach(t => document.getElementById('page-' + t).classList.toggle('active', t === tab));
  if (tab === 'list') loadRecords();
  if (tab === 'inbox') renderInbox();
}
const GAS_URL = 'https://script.google.com/macros/s/AKfycbxUxCLCjOcAW-6Xmjmbxe8bPfv8XZ3sEJEXBKYJbK_yM8CNtkNnTnVsZA2VcNoeCc0Hkw/exec';
  
const CATEGORIES = [
  { key: '餐', icon: '🍜' },
  { key: '玩', icon: '🎡' },
  { key: '交', icon: '🚃' },
  { key: '雜', icon: '🛍️' },
  { key: '紀', icon: '🎁' },
  { key: '住', icon: '🏨' },
  { key: '藥', icon: '💊' },
];
const PAYMENTS = [
  { key: 'SUICA',        icon: '🐧' },
  { key: '吉鶴卡',       icon: '💳' },
  { key: 'LINE(DAWAY)',  icon: '💚' },
  { key: '現金',         icon: '💴' },
  { key: '街口(UBEAR)',  icon: '🐻' },
  { key: '全支付(PayPay)', icon: '🔴' },
  { key: 'GoGo',        icon: '🟡' },
  { key: 'CUBE',        icon: '🟦' },
];
let selectedCat = '';
let selectedPay = '';
let jpyParts = [];
// ── 密碼解鎖（固定為系統當天日期 MMDD，不對外顯示格式提示） ──
let unlocked = false;
function todayPassword() {
  const now = new Date();
  const mm = String(now.getMonth() + 1).padStart(2, '0');
  const dd = String(now.getDate()).padStart(2, '0');
  return mm + dd;
}
function openLockOverlay() {
  document.getElementById('lmError').textContent = '';
  document.getElementById('inputPwd').value = '';
  document.getElementById('lockOverlay').classList.remove('hidden');
  setTimeout(() => document.getElementById('inputPwd').focus(), 50);
}
function closeLockOverlay() {
  document.getElementById('lockOverlay').classList.add('hidden');
}
function confirmPassword() {
  const val = document.getElementById('inputPwd').value.trim();
  if (val && val === todayPassword()) {
    unlocked = true;
    updateLockUI();
    refreshInboxIfOpen();
    closeLockOverlay();
    showToast('🔓 解鎖成功');
  } else {
    document.getElementById('lmError').textContent = '密碼錯誤，請再試一次';
    document.getElementById('inputPwd').value = '';
    document.getElementById('inputPwd').focus();
  }
}
function skipPassword() {
  closeLockOverlay();
  updateLockUI();
}
function updateLockUI() {
  const iconBtn = document.getElementById('lockIconBtn');
  const submitBtn = document.getElementById('submitBtn');
  if (unlocked) {
    iconBtn.textContent = '🔓';
    iconBtn.classList.add('unlocked');
    submitBtn.disabled = false;
  } else {
    iconBtn.textContent = '🔒';
    iconBtn.classList.remove('unlocked');
    submitBtn.disabled = true;
  }
}
function refreshInboxIfOpen() {
  if (document.getElementById('page-inbox').classList.contains('active')) renderInbox();
}
// ── 初始化 ──
function init() {
  // 預設今天
  const now = new Date();
  document.getElementById('inputMonth').value = now.getMonth() + 1;
  document.getElementById('inputDay').value = now.getDate();
  // 類別格子
  const catGrid = document.getElementById('catGrid');
  CATEGORIES.forEach(c => {
    const btn = document.createElement('button');
    btn.className = 'cat-btn';
    btn.innerHTML = `<span class="btn-icon">${c.icon}</span><span class="btn-label">${c.key}</span>`;
    btn.onclick = () => selectCat(c.key);
    btn.dataset.key = c.key;
    catGrid.appendChild(btn);
  });
  // 付款格子
  const payGrid = document.getElementById('payGrid');
  PAYMENTS.forEach(p => {
    const btn = document.createElement('button');
    btn.className = 'pay-btn';
    btn.innerHTML = `<span class="btn-icon">${p.icon}</span><span class="btn-label">${p.key}</span>`;
    btn.onclick = () => selectPay(p.key);
    btn.dataset.key = p.key;
    payGrid.appendChild(btn);
  });
  updateLockUI();
  updateInboxBadge();
  openLockOverlay();
  loadRecords();
}
function selectCat(c) {
  selectedCat = c;
  document.querySelectorAll('#catGrid .cat-btn').forEach(b => b.classList.toggle('active', b.dataset.key === c));
}
function selectPay(p) {
  selectedPay = p;
  document.querySelectorAll('#payGrid .pay-btn').forEach(b => b.classList.toggle('active', b.dataset.key === p));
}
// ── JPY 累加器 ──
function addChip() {
  const input = document.getElementById('inputJpy');
  const val = parseInt(input.value);
  if (!val || val <= 0) return;
  jpyParts.push(val);
  input.value = '';
  renderChips();
  input.focus();
}
function removeChip(i) {
  jpyParts.splice(i, 1);
  renderChips();
}
function renderChips() {
  const container = document.getElementById('chips');
  const subtotal = document.getElementById('subtotal');
  container.innerHTML = '';
  jpyParts.forEach((v, i) => {
    const chip = document.createElement('div');
    chip.className = 'chip';
    chip.innerHTML = `¥${v.toLocaleString()} <span class="x">×</span>`;
    chip.onclick = () => removeChip(i);
    container.appendChild(chip);
  });
  if (jpyParts.length > 0) {
    const sum = jpyParts.reduce((a, b) => a + b, 0);
    subtotal.textContent = `小計：¥${sum.toLocaleString()}`;
  } else {
    subtotal.textContent = '';
  }
}
// ── 送出 ──
let isSubmitting = false;
function makeRequestId() {
  return 'r' + Date.now() + '_' + Math.random().toString(36).slice(2, 10);
}
// 寫入 Google Sheet（記帳表單與暫存匣共用）
async function gasWrite(fields, requestId) {
  const params = new URLSearchParams({ action: 'write', ...fields, requestId: requestId || makeRequestId() });
  // 網路不穩時避免無限卡住：15 秒逾時就視為失敗，讓使用者可重試
  const controller = new AbortController();
  const timeoutId = setTimeout(() => controller.abort(), 15000);
  try {
    const res = await fetch(`${GAS_URL}?${params}`, { signal: controller.signal });
    const json = await res.json().catch(() => null);
    if (json && json.success === false) throw new Error(json.error || '送出失敗');
  } finally {
    clearTimeout(timeoutId);
  }
}
async function submitRecord() {
  if (!unlocked) return showToast('🔒 請先輸入密碼解鎖');
  if (isSubmitting) return; // 防止網路重試/連點造成重複送出
  const month = document.getElementById('inputMonth').value;
  const day = document.getElementById('inputDay').value;
  const name = document.getElementById('inputName').value.trim();
  const extraJpy = parseInt(document.getElementById('inputJpy').value) || 0;
  const kid = parseInt(document.getElementById('inputKid').value) || 0;
  const en = parseInt(document.getElementById('inputEn').value) || 0;
  const totalJpy = jpyParts.reduce((a, b) => a + b, 0) + extraJpy;
  if (!month || !day) return showToast('請輸入日期');
  if (!name) return showToast('請輸入品項名稱');
  if (totalJpy <= 0) return showToast('請輸入金額');
  if (!selectedCat) return showToast('請選擇類別');
  if (!selectedPay) return showToast('請選擇付款工具');
  const btn = document.getElementById('submitBtn');
  isSubmitting = true;
  btn.disabled = true;
  btn.textContent = '送出中…';
  try {
    await gasWrite({
      date: `${month}/${day}`,
      chinese: name,
      jpy: totalJpy,
      category: selectedCat,
      payment: selectedPay,
      kid: kid,
      en: en,
    });
    // 清空
    document.getElementById('inputName').value = '';
    document.getElementById('inputJpy').value = '';
    document.getElementById('inputKid').value = '0';
    document.getElementById('inputEn').value = '0';
    jpyParts = [];
    renderChips();
    showToast('✓ 記帳成功！');
  } catch (e) {
    showToast('❌ 送出失敗（可能是網路問題），請確認紀錄頁是否已有這筆，避免重複送出');
  }
  isSubmitting = false;
  btn.disabled = !unlocked;
  btn.textContent = '記帳 ✓';
}
// ── 讀取紀錄 ──
async function loadRecords() {
  const list = document.getElementById('recordList');
  list.innerHTML = '<div class="loading-msg">讀取中…</div>';
  try {
    const res = await fetch(GAS_URL);
    const json = await res.json();
    if (!json.success) throw new Error();
    renderRecords(json.data || []);
  } catch {
    list.innerHTML = '<div class="loading-msg">無法讀取資料</div>';
  }
}
function renderRecords(data) {
  const list = document.getElementById('recordList');
  const totalEl = document.getElementById('listTotal');
  if (!data.length) {
    list.innerHTML = '<div class="loading-msg">尚無紀錄</div>';
    totalEl.innerHTML = '';
    return;
  }
  // 反轉（最新在上）
  const reversed = [...data].reverse();
  const totalJpy = data.reduce((s, r) => s + (Number(r.jpy) || 0), 0);
  const totalTwd = Math.round(totalJpy * 0.2);
  totalEl.innerHTML = `<small>合計</small>¥${totalJpy.toLocaleString()} <small style="font-size:10px;opacity:.5">≈ NT$${totalTwd.toLocaleString()}</small>`;
  list.innerHTML = '';
  reversed.forEach(r => {
    const jpy = Number(r.jpy) || 0;
    const twd = Math.round(jpy * 0.2);
    const kid = Number(r.kid) || 0;
    const en = Number(r.en) || 0;
    // 日期格式化
    let dateStr = r.date;
    try {
      const d = new Date(r.date);
      if (!isNaN(d)) dateStr = `${d.getMonth()+1}/${d.getDate()}`;
    } catch {}
    // 屁孩/它人 分攤小字（都是0就不顯示）
    let extraStr = '';
    const extraBits = [];
    if (kid) extraBits.push(`屁孩¥${kid.toLocaleString()}`);
    if (en) extraBits.push(`它人¥${en.toLocaleString()}`);
    if (extraBits.length) extraStr = `<div class="rec-extra">${extraBits.join(' · ')}</div>`;
    const item = document.createElement('div');
    item.className = 'record-item';
    item.innerHTML = `
      <div class="rec-date">${dateStr}</div>
      <div class="rec-cat">${(CATEGORIES.find(c => c.key === r.category) || {}).icon || ''} ${r.category || ''}</div>
      <div class="rec-main">
        <div class="rec-name">${r.chinese || ''}</div>
        ${extraStr}
      </div>
      <div class="rec-amounts">
        <div class="rec-jpy">¥${jpy.toLocaleString()}</div>
        <div class="rec-twd">NT$${twd.toLocaleString()}</div>
      </div>
      <button class="del-btn" onclick="deleteRecord(${r.row})" title="刪除">✕</button>
    `;
    list.appendChild(item);
  });
}
// ── 刪除 ──
async function deleteRecord(row) {
  if (!unlocked) return showToast('🔒 請先輸入密碼解鎖');
  if (!confirm('確定刪除這筆紀錄？')) return;
  try {
    await fetch(`${GAS_URL}?action=delete&row=${row}`);
    showToast('已刪除');
    loadRecords();
  } catch {
    showToast('❌ 刪除失敗');
  }
}
// ── 暫存匣（發票解析／日幣換算送來的資料） ──
const inboxSubmitting = new Set();
function inboxEsc(s) {
  return String(s ?? '').replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
}
function inboxGet(id) {
  return KakeiboInbox.load().find(e => e.id === id);
}
function inboxUpdate(id, patch) {
  const list = KakeiboInbox.load();
  const e = list.find(x => x.id === id);
  if (!e) return null;
  Object.assign(e, typeof patch === 'function' ? patch(e) : patch);
  KakeiboInbox.save(list);
  return e;
}
function inboxMissing(e) {
  const miss = [];
  const [m, d] = String(e.date || '').split('/');
  if (!(+m >= 1 && +m <= 12 && +d >= 1 && +d <= 31)) miss.push('日期');
  if (!String(e.name || '').trim()) miss.push('品項名稱');
  if (!(Number(e.jpy) > 0)) miss.push('金額');
  if (!e.cat) miss.push('類別');
  if (!e.pay) miss.push('付款工具');
  return miss;
}
function updateInboxBadge() {
  const n = KakeiboInbox.load().length;
  document.getElementById('inboxBadge').textContent = n ? n : '';
}
function renderInbox() {
  updateInboxBadge();
  const list = KakeiboInbox.load();
  const box = document.getElementById('inboxList');
  if (!list.length) {
    box.innerHTML = '<div class="card"><div class="loading-msg">暫存是空的</div></div>';
    return;
  }
  box.innerHTML = list.map(e => {
    const [m, d] = String(e.date || '').split('/');
    const srcLabel = e.src === 'cart' ? '🛒 日幣換算' : '🧾 發票';
    const t = new Date(e.createdAt).toLocaleString('zh-TW', { month: 'numeric', day: 'numeric', hour: '2-digit', minute: '2-digit', hour12: false });
    const lines = (e.lines || []).length ? `
      <details class="detail-box">
        <summary>明細 ${e.lines.length} 項（取消勾選會從金額扣掉）</summary>
        ${e.lines.map((l, i) => `
          <label class="detail-line${l.on === false ? ' off' : ''}">
            <input type="checkbox" ${l.on === false ? '' : 'checked'} onchange="inboxToggleLine('${e.id}', ${i}, this.checked)">
            <span class="dl-name">${inboxEsc(l.name)}${l.sub ? `<small>${inboxEsc(l.sub)}</small>` : ''}</span>
            <span class="dl-jpy">¥${(Number(l.jpy) || 0).toLocaleString()}</span>
          </label>`).join('')}
      </details>` : '';
    const cats = CATEGORIES.map(c => `<button class="cat-btn${e.cat === c.key ? ' active' : ''}" data-key="${c.key}" onclick="inboxPick('${e.id}', 'cat', '${c.key}', this)"><span class="btn-icon">${c.icon}</span><span class="btn-label">${c.key}</span></button>`).join('');
    const pays = PAYMENTS.map(p => `<button class="pay-btn${e.pay === p.key ? ' active' : ''}" data-key="${p.key}" onclick="inboxPick('${e.id}', 'pay', '${p.key}', this)"><span class="btn-icon">${p.icon}</span><span class="btn-label">${p.key}</span></button>`).join('');
    const miss = inboxMissing(e);
    const busy = inboxSubmitting.has(e.id);
    return `
    <div class="card inbox-card" id="${e.id}">
      <div class="inbox-head">
        <span class="src-tag ${e.src === 'cart' ? 'cart' : ''}">${srcLabel}</span>
        <span class="inbox-time">${t} 送入</span>
        <button class="del-btn" onclick="inboxDiscard('${e.id}')" title="捨棄">✕</button>
      </div>
      <label>日期 / 金額（¥）</label>
      <div class="inbox-row date">
        <input type="number" min="1" max="12" placeholder="月" value="${inboxEsc(m || '')}" oninput="inboxDate('${e.id}')" data-f="m">
        <div class="date-sep">/</div>
        <input type="number" min="1" max="31" placeholder="日" value="${inboxEsc(d || '')}" oninput="inboxDate('${e.id}')" data-f="d">
        <input type="number" inputmode="numeric" placeholder="金額" value="${inboxEsc(e.jpy || '')}" oninput="inboxField('${e.id}', 'jpy', this.value)" data-f="jpy">
      </div>
      <label>品項名稱</label>
      <input type="text" style="margin-bottom:10px" value="${inboxEsc(e.name)}" placeholder="例：藥妝店、便利商店…" oninput="inboxField('${e.id}', 'name', this.value)">
      ${lines}
      <label>類別</label>
      <div class="cat-grid">${cats}</div>
      <label>付款工具</label>
      <div class="pay-grid">${pays}</div>
      <div class="extra-grid" style="margin-bottom:10px">
        <div><label>HAO支出</label><input type="number" inputmode="numeric" value="${Number(e.kid) || 0}" oninput="inboxField('${e.id}', 'kid', this.value)"></div>
        <div><label>它人支出</label><input type="number" inputmode="numeric" value="${Number(e.en) || 0}" oninput="inboxField('${e.id}', 'en', this.value)"></div>
      </div>
      <div class="inbox-missing">${miss.length ? '還缺：' + miss.join('、') : ''}</div>
      <button class="submit-btn" onclick="inboxSubmit('${e.id}')" ${!unlocked || busy ? 'disabled' : ''}>${busy ? '送出中…' : (unlocked ? '入檔 ✓' : '🔒 解鎖後才能入檔')}</button>
    </div>`;
  }).join('');
}
function inboxRefreshMissing(id) {
  const e = inboxGet(id);
  const card = document.getElementById(id);
  if (!e || !card) return;
  const miss = inboxMissing(e);
  card.querySelector('.inbox-missing').textContent = miss.length ? '還缺：' + miss.join('、') : '';
}
function inboxField(id, field, value) {
  const num = ['jpy', 'kid', 'en'].includes(field);
  inboxUpdate(id, { [field]: num ? (parseInt(value) || 0) : value });
  inboxRefreshMissing(id);
}
function inboxDate(id) {
  const card = document.getElementById(id);
  const m = card.querySelector('[data-f=m]').value;
  const d = card.querySelector('[data-f=d]').value;
  inboxUpdate(id, { date: `${m}/${d}` });
  inboxRefreshMissing(id);
}
function inboxPick(id, field, key, btn) {
  inboxUpdate(id, { [field]: key });
  btn.parentElement.querySelectorAll('button').forEach(b => b.classList.toggle('active', b.dataset.key === key));
  inboxRefreshMissing(id);
}
function inboxToggleLine(id, idx, on) {
  const e = inboxUpdate(id, x => {
    const lines = x.lines.slice();
    const line = Object.assign({}, lines[idx]);
    if ((line.on !== false) === on) return {};
    line.on = on;
    lines[idx] = line;
    const delta = (Number(line.jpy) || 0) * (on ? 1 : -1);
    return { lines, jpy: Math.max(0, (Number(x.jpy) || 0) + delta) };
  });
  if (!e) return;
  const card = document.getElementById(id);
  card.querySelector('[data-f=jpy]').value = e.jpy;
  card.querySelectorAll('.detail-line')[idx].classList.toggle('off', !on);
  inboxRefreshMissing(id);
}
function inboxDiscard(id) {
  if (!confirm('捨棄這筆暫存？（不會入檔）')) return;
  KakeiboInbox.save(KakeiboInbox.load().filter(e => e.id !== id));
  renderInbox();
}
async function inboxSubmit(id) {
  if (!unlocked) return showToast('🔒 請先輸入密碼解鎖');
  if (inboxSubmitting.has(id)) return;
  const e = inboxGet(id);
  if (!e) return renderInbox();
  const miss = inboxMissing(e);
  if (miss.length) return showToast('還缺：' + miss.join('、'));
  // 固定 requestId：失敗重送時，後端可以用它擋掉重複
  const requestId = e.requestId || makeRequestId();
  inboxUpdate(id, { requestId });
  inboxSubmitting.add(id);
  renderInbox();
  try {
    const [m, d] = e.date.split('/');
    await gasWrite({
      date: `${+m}/${+d}`,
      chinese: e.name.trim(),
      jpy: e.jpy,
      category: e.cat,
      payment: e.pay,
      kid: Number(e.kid) || 0,
      en: Number(e.en) || 0,
    }, requestId);
    KakeiboInbox.save(KakeiboInbox.load().filter(x => x.id !== id));
    showToast('✓ 已入檔');
  } catch (err) {
    showToast('❌ 入檔失敗，請到紀錄頁確認是否已有這筆再重送');
  }
  inboxSubmitting.delete(id);
  renderInbox();
}
// 其他頁籤（iframe）送進暫存時即時更新
window.addEventListener('storage', ev => {
  if (ev.key !== KakeiboInbox.KEY) return;
  if (document.getElementById('page-inbox').classList.contains('active')) {
    // 正在輸入時不重畫，避免游標跳掉
    const focused = document.activeElement && document.activeElement.closest && document.activeElement.closest('.inbox-card');
    if (!focused) renderInbox(); else updateInboxBadge();
  } else {
    updateInboxBadge();
  }
});
// ── Toast ──
function showToast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  setTimeout(() => t.classList.remove('show'), 2200);
}
// Enter 鍵
document.addEventListener('DOMContentLoaded', () => {
  init();
  document.getElementById('inputJpy').addEventListener('keydown', e => {
    if (e.key === 'Enter') addChip();
  });
  document.getElementById('inputPwd').addEventListener('keydown', e => {
    if (e.key === 'Enter') confirmPassword();
  });
});
</script>
