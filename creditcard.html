<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>日本信用卡優惠（2026年10月版）</title>
<link href="https://fonts.googleapis.com/css2?family=Zen+Maru+Gothic:wght@400;700;900&family=Noto+Sans+TC:wght@400;700&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
<style>
  :root {
    --cream: #f3f5f8;
    --pink: #c9dcf0;
    --pink-dark: #2f6fb3;
    --mint: #b8e8d8;
    --mint-dark: #5abf9a;
    --yellow: #fce97a;
    --lavender: #d4c8f0;
    --brown: #1f3350;
    --text: #14233a;
    --muted: #5c708a;
    --border: #d6dee8;
    --surface: #ffffff;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    font-family: 'Noto Sans TC', sans-serif;
    background: var(--cream);
    color: var(--text);
    min-height: 100vh;
  }

  body::before {
    content: '';
    position: fixed; inset: 0;
    background-image: radial-gradient(circle, #d3dbe6 1px, transparent 1px);
    background-size: 24px 24px;
    opacity: 0.45;
    pointer-events: none;
    z-index: 0;
  }

  .container {
    position: relative; z-index: 1;
    max-width: 480px;
    margin: 0 auto;
    padding: 20px 16px 48px;
  }

  .header { text-align: center; padding: 20px 0 18px; }
  .header h1 {
    font-family: 'Zen Maru Gothic', sans-serif;
    font-size: 22px; font-weight: 900; color: var(--brown);
  }
  .header-sub { font-size: 12px; color: var(--muted); margin-top: 4px; }

  .filter-bar {
    display: flex; gap: 8px; margin-bottom: 16px; overflow-x: auto; padding-bottom: 8px;
  }
  .filter-btn {
    padding: 6px 14px; border-radius: 99px;
    font-size: 12px; font-weight: 700;
    border: 1.5px solid var(--border); background: white;
    color: var(--text); cursor: pointer;
    white-space: nowrap; transition: all 0.15s;
    flex-shrink: 0;
  }
  .filter-btn:hover { border-color: var(--pink-dark); }
  .filter-btn.active { background: var(--pink-dark); color: white; border-color: var(--pink-dark); }

  .card-list { display: flex; flex-direction: column; gap: 12px; }

  .card-item {
    background: var(--surface);
    border-radius: 16px;
    padding: 14px;
    border: 2px solid var(--border);
    box-shadow: 0 2px 8px rgba(20,35,58,0.06);
    cursor: pointer; transition: all 0.15s;
  }
  .card-item:hover { border-color: var(--pink-dark); transform: translateY(-2px); }

  .card-header {
    display: flex; align-items: center; gap: 10px;
    margin-bottom: 10px;
  }

  .card-rank {
    display: flex; align-items: center; justify-content: center;
    width: 32px; height: 32px; border-radius: 50%;
    background: var(--pink); color: white;
    font-family: 'Zen Maru Gothic', sans-serif;
    font-weight: 900; font-size: 14px;
  }

  .card-name {
    flex: 1;
    font-family: 'Zen Maru Gothic', sans-serif;
    font-size: 14px; font-weight: 900; color: var(--brown);
  }

  .card-badge {
    display: inline-block;
    font-size: 9px; font-weight: 700;
    padding: 3px 8px; border-radius: 6px;
    background: var(--yellow); color: #7a6020;
  }

  .card-issuer { font-size: 10px; color: var(--muted); margin-top: 2px; }

  .card-rewards {
    font-size: 12px; line-height: 1.6;
    margin: 10px 0;
    padding: 10px;
    background: #e9eef4; border-radius: 8px;
    border-left: 3px solid var(--pink);
  }

  .reward-title { font-weight: 700; color: var(--brown); margin-bottom: 4px; }
  .reward-detail { color: var(--text); font-size: 11px; }

  .card-usage {
    font-size: 11px; color: var(--text);
    padding: 8px; background: #f0fff8; border-radius: 8px;
    border-left: 3px solid var(--mint);
  }

  .usage-label { font-weight: 700; color: var(--mint-dark); }

  .card-verdict {
    margin-top: 10px; padding: 8px;
    background: #fffbee; border-radius: 8px;
    border-left: 3px solid var(--yellow);
    font-size: 11px; color: #7a6020; line-height: 1.6;
  }

  .card-note {
    margin-top: 8px; padding: 8px;
    background: #fdeeee; border-radius: 8px;
    border-left: 3px solid #e88a8a;
    font-size: 10px; color: #a04040; line-height: 1.6;
  }

  .verdict-icon { font-size: 12px; margin-right: 4px; }

  .tips-card {
    background: #fef3c7; border: 2px solid var(--yellow);
    border-radius: 12px; padding: 12px 14px;
    margin-bottom: 16px;
  }
  .tips-title { font-family: 'Zen Maru Gothic', sans-serif; font-size: 12px; font-weight: 900; color: #7a6020; margin-bottom: 6px; }
  .tips-text { font-size: 11px; color: #7a6020; line-height: 1.6; }

  .empty { text-align: center; color: var(--muted); font-size: 14px; padding: 32px 0; }
  .empty-icon { font-size: 36px; margin-bottom: 8px; }

  .filter-bar::-webkit-scrollbar { height: 4px; }
  .filter-bar::-webkit-scrollbar-track { background: transparent; }
  .filter-bar::-webkit-scrollbar-thumb { background: var(--border); border-radius: 2px; }

  .footer-note {
    text-align: center; font-size: 10px; color: var(--muted);
    margin-top: 20px; line-height: 1.6;
  }
</style>
<link rel="icon" href="favicon.ico" sizes="any">
<link rel="icon" type="image/png" sizes="32x32" href="favicon-32.png">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
</head>
<body>
<div class="container">

  <div class="header">
    <h1>💳 台灣信用卡優惠</h1>
    <div class="header-sub">Top 6 信用卡・日本旅遊回饋一覽（2026/10/24 更新）</div>
  </div>

  <div class="tips-card">
    <div class="tips-title">💡 日本旅遊小撇步</div>
    <div class="tips-text">
      • 表列回饋率皆未扣國外交易服務費（台灣卡在日本消費普遍收1.5%）<br>
      • 富邦J卡Q4加碼：10月登錄窗口開到 10/31，名額有限先搶<br>
      • 交通卡儲值加碼多為「每月登錄」：富邦11/18、聯邦11/15開放<br>
      • CUBE秋日遊只到11/30，12/1要切回趣旅行<br>
      • 星展11月記得登錄海外餐廳10%
    </div>
  </div>

  <div class="filter-bar">
    <button class="filter-btn active" onclick="filterCards('all')">全部</button>
    <button class="filter-btn" onclick="filterCards('nomind')">無腦刷</button>
    <button class="filter-btn" onclick="filterCards('travel')">日本旅遊</button>
    <button class="filter-btn" onclick="filterCards('pay')">支付優惠</button>
  </div>

  <div class="card-list" id="cardList"></div>

  <div class="footer-note">
    資料整理自公開網路資訊，實際回饋內容與活動期限請以各銀行官網公告為準。
  </div>

</div>

<script>
  const cardsData = [
    {
      rank: 1,
      name: '富邦J卡',
      issuer: '台北富邦銀行',
      baseReward: '3.0%',
      rewards: '• 日韓泰實體消費 3% 無上限（到2026/12/31；需設定電子帳單或富邦帳戶自動扣繳，否則只有0.5%）\n• 加碼3%：Q4(10/1-12/31)單筆滿NT$1,000，登錄後最高6%，每季上限NT$1,000（約刷NT$33,333）\n• Q4登錄窗口：10/20 16:00～10/31、11/20 16:00起、12/20 16:00起，每月限2萬名，一季登錄一次即可\n• Apple Pay儲值Suica/PASMO/ICOCA：單筆滿NT$2,000＋當月登錄，加碼7%（合計10%），每季上限NT$200；11月登錄11/18 16:00開放，每月限1萬名',
      usage: '日本旅遊：實體消費＋交通卡儲值雙重回饋',
      verdict: '🔴 Q4加碼3%的10月登錄窗口現在開著（到10/31），名額2萬搶完就沒，趁早登錄；交通卡7%要在11/18之後登錄11月那一期再儲值',
      tags: ['travel', 'pay']
    },
    {
      rank: 2,
      name: '玉山熊本熊卡',
      issuer: '玉山銀行',
      baseReward: '2.5%',
      rewards: '• 日本一般消費 2.5% 無上限（到2026/12/31）\n• 指定日本商店登錄後加碼6%，最高8.5%；加碼部分每期帳單上限NT$500（約刷NT$8,333）\n• 活動期間2026/7/1-12/31登錄一次即可；2025年登錄過的，2026年要重新登錄\n• 會收1.5%國外交易服務費（雙幣卡也一樣收），扣完一般消費實拿約1%、指定商店約7%\n• 綁玉山Wallet的PayPay付款免服務費，但改走PayPay活動回饋',
      usage: '日本指定商店專刷，非指定商店改用其他卡',
      verdict: '💎 只有指定商店值得刷，且每期加碼上限500元很快吃滿；先上活動頁確認2026年已登錄',
      tags: ['travel']
    },
    {
      rank: 3,
      name: '聯邦吉鶴卡',
      issuer: '聯邦銀行',
      baseReward: '2.5%',
      rewards: '• 日幣實體消費 2.5% 無上限（下半年延續）\n• 日本Apple Pay/Google Pay感應支付加碼：登錄＋1.5%（月上限NT$600）；前月聯邦帳單達門檻再＋1%（上限NT$200，單筆需滿NT$100）\n• 下半年新增：日幣儲值Suica/PASMO/ICOCA最高1.5%，每月15日10:00開放登錄、限1萬名，須當月先登錄再儲值\n• 新戶日本實體消費加碼3%（歸戶上限NT$600）',
      usage: '無腦刷：日幣無上限 2.5%，用手機感應可再疊加',
      verdict: '🌟 底子穩；出發前App登錄感應支付加碼，交通卡儲值記得11/15登錄11月那期',
      tags: ['nomind', 'travel', 'pay']
    },
    {
      rank: 4,
      name: '星展 eco 永續卡',
      issuer: '星展銀行',
      baseReward: '5.0%',
      rewards: '• 日本等指定國家實體消費 5%（1%基本＋4%加碼，到2026/12/31）；4%加碼每期帳單上限600點（約刷NT$15,000）\n• 須實體卡或Apple Pay/Samsung Pay在當地實體店、以非台幣計價\n• 9/1-12/31新活動：海外實體餐廳最高10%，需每月登錄，單筆/單日上限NT$300、每月上限NT$1,000\n• Suica/PASMO等交通卡儲值不適用4%加碼；現金積點需18個月內使用',
      usage: '旅遊：日本實體消費5%＋餐廳加碼',
      verdict: '✈️ 夏天「摘星啟程」高倍數已結束（8/31），但11月新增海外餐廳10%可用，記得11月登錄；一般消費刷超過約1.5萬就只剩1%',
      tags: ['travel']
    },
    {
      rank: 5,
      name: '台新Richart卡（原FlyGo）',
      issuer: '台新銀行',
      baseReward: '3.3%',
      rewards: '• App切換「玩旅刷」方案，海外消費3.3%無上限（延長至2027/03/31）\n• 10月起新加碼：最高6%（3.3%＋2.7%），條件是Richart外幣帳戶月底美元餘額≥US$500、在Richart Life App領券並完成換匯任務、刷指定海外通路\n• 加碼部分與其他切換刷加碼合計每月上限200點，每月名額有限\n• 外幣帳戶維持US$500，次月第一筆海外ATM提領手續費退還（到2027/3）',
      usage: '海外消費：切換「玩旅刷」後3.3%無上限',
      verdict: '✅ 3.3%穩穩拿；6%門檻高、上限只有200點，沒在用Richart外幣帳戶的話不必刻意追',
      tags: ['nomind', 'travel', 'pay']
    },
    {
      rank: 6,
      name: '國泰世華CUBE卡',
      issuer: '國泰世華銀行',
      baseReward: '3.5%',
      rewards: '• 新權益「秋日遊」（2026/10/1-11/30）：日本實體消費3.5%，四大機場免稅店4%，寶可夢中心/三麗鷗/UNIQLO等名店與Tabelog訂位5%\n• Apple錢包Suica/PASMO/ICOCA儲值、GO Taxi 3.5%，領券最高5%；BicCamera、愛電王等領券後最高約10%\n• 12月起秋日遊結束，改切「趣旅行」：海外實體 Level1 2%／Level2 3%／Level3 3.3%（到2026/12/31）\n• 消費前需在App切換方案、領券加碼需先在App領券',
      usage: '11/28-11/30用「秋日遊」，12/1-12/2切回「趣旅行」',
      verdict: '✈️ 前3天剛好吃到秋日遊3.5%；12/1記得切到趣旅行，不然回饋會掉',
      tags: ['travel', 'pay']
    }
  ];

  let currentFilter = 'all';

  function filterCards(tag) {
    currentFilter = tag;
    document.querySelectorAll('.filter-btn').forEach(btn => {
      btn.classList.remove('active');
    });
    event.target.classList.add('active');
    renderCards();
  }

  function renderCards() {
    const container = document.getElementById('cardList');
    let filtered = cardsData;

    if (currentFilter !== 'all') {
      filtered = cardsData.filter(card => card.tags.includes(currentFilter));
    }

    if (!filtered.length) {
      container.innerHTML = '<div class="empty"><div class="empty-icon">🔍</div>沒有符合的信用卡</div>';
      return;
    }

    container.innerHTML = filtered.map(card => `
      <div class="card-item">
        <div class="card-header">
          <div class="card-rank">#${card.rank}</div>
          <div>
            <div class="card-name">${card.name}</div>
            <div class="card-issuer">${card.issuer}</div>
          </div>
          <div class="card-badge">${card.baseReward}回饋</div>
        </div>

        <div class="card-rewards">
          <div class="reward-title">💎 回饋詳情</div>
          <div class="reward-detail">${card.rewards.split('\n').join('<br>')}</div>
        </div>

        <div class="card-usage">
          <span class="usage-label">📌 使用情境：</span><br>
          ${card.usage}
        </div>

        <div class="card-verdict">
          ${card.verdict}
        </div>
      </div>
    `).join('');
  }

  renderCards();
</script>
</body>
</html>
