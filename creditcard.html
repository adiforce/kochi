<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>日本信用卡優惠（2026年9月版）</title>
<link href="https://fonts.googleapis.com/css2?family=Zen+Maru+Gothic:wght@400;700;900&family=Noto+Sans+TC:wght@400;700&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
<style>
  :root {
    --cream: #fdf6ee;
    --pink: #f5b8c8;
    --pink-dark: #e8849a;
    --mint: #b8e8d8;
    --mint-dark: #5abf9a;
    --yellow: #fce97a;
    --lavender: #d4c8f0;
    --brown: #7a4f3a;
    --text: #3d2b1f;
    --muted: #a07060;
    --border: #ead8c8;
    --surface: #ffffff;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    font-family: 'Noto Sans TC', sans-serif;
    background: var(--cream);
    color: var(--text);
    min-height: 100vh;
  }

  body::before {
    content: '';
    position: fixed; inset: 0;
    background-image: radial-gradient(circle, #e8d5c4 1px, transparent 1px);
    background-size: 24px 24px;
    opacity: 0.45;
    pointer-events: none;
    z-index: 0;
  }

  .container {
    position: relative; z-index: 1;
    max-width: 480px;
    margin: 0 auto;
    padding: 20px 16px 48px;
  }

  .header { text-align: center; padding: 20px 0 18px; }
  .header h1 {
    font-family: 'Zen Maru Gothic', sans-serif;
    font-size: 22px; font-weight: 900; color: var(--brown);
  }
  .header-sub { font-size: 12px; color: var(--muted); margin-top: 4px; }

  .filter-bar {
    display: flex; gap: 8px; margin-bottom: 16px; overflow-x: auto; padding-bottom: 8px;
  }
  .filter-btn {
    padding: 6px 14px; border-radius: 99px;
    font-size: 12px; font-weight: 700;
    border: 1.5px solid var(--border); background: white;
    color: var(--text); cursor: pointer;
    white-space: nowrap; transition: all 0.15s;
    flex-shrink: 0;
  }
  .filter-btn:hover { border-color: var(--pink-dark); }
  .filter-btn.active { background: var(--pink-dark); color: white; border-color: var(--pink-dark); }

  .card-list { display: flex; flex-direction: column; gap: 12px; }

  .card-item {
    background: var(--surface);
    border-radius: 16px;
    padding: 14px;
    border: 2px solid var(--border);
    box-shadow: 0 2px 8px rgba(100,60,40,0.06);
    cursor: pointer; transition: all 0.15s;
  }
  .card-item:hover { border-color: var(--pink-dark); transform: translateY(-2px); }

  .card-header {
    display: flex; align-items: center; gap: 10px;
    margin-bottom: 10px;
  }

  .card-rank {
    display: flex; align-items: center; justify-content: center;
    width: 32px; height: 32px; border-radius: 50%;
    background: var(--pink); color: white;
    font-family: 'Zen Maru Gothic', sans-serif;
    font-weight: 900; font-size: 14px;
  }

  .card-name {
    flex: 1;
    font-family: 'Zen Maru Gothic', sans-serif;
    font-size: 14px; font-weight: 900; color: var(--brown);
  }

  .card-badge {
    display: inline-block;
    font-size: 9px; font-weight: 700;
    padding: 3px 8px; border-radius: 6px;
    background: var(--yellow); color: #7a6020;
  }

  .card-issuer { font-size: 10px; color: var(--muted); margin-top: 2px; }

  .card-rewards {
    font-size: 12px; line-height: 1.6;
    margin: 10px 0;
    padding: 10px;
    background: #f5ede4; border-radius: 8px;
    border-left: 3px solid var(--pink);
  }

  .reward-title { font-weight: 700; color: var(--brown); margin-bottom: 4px; }
  .reward-detail { color: var(--text); font-size: 11px; }

  .card-usage {
    font-size: 11px; color: var(--text);
    padding: 8px; background: #f0fff8; border-radius: 8px;
    border-left: 3px solid var(--mint);
  }

  .usage-label { font-weight: 700; color: var(--mint-dark); }

  .card-verdict {
    margin-top: 10px; padding: 8px;
    background: #fffbee; border-radius: 8px;
    border-left: 3px solid var(--yellow);
    font-size: 11px; color: #7a6020; line-height: 1.6;
  }

  .card-note {
    margin-top: 8px; padding: 8px;
    background: #fdeeee; border-radius: 8px;
    border-left: 3px solid #e88a8a;
    font-size: 10px; color: #a04040; line-height: 1.6;
  }

  .verdict-icon { font-size: 12px; margin-right: 4px; }

  .tips-card {
    background: #fef3c7; border: 2px solid var(--yellow);
    border-radius: 12px; padding: 12px 14px;
    margin-bottom: 16px;
  }
  .tips-title { font-family: 'Zen Maru Gothic', sans-serif; font-size: 12px; font-weight: 900; color: #7a6020; margin-bottom: 6px; }
  .tips-text { font-size: 11px; color: #7a6020; line-height: 1.6; }

  .empty { text-align: center; color: var(--muted); font-size: 14px; padding: 32px 0; }
  .empty-icon { font-size: 36px; margin-bottom: 8px; }

  .filter-bar::-webkit-scrollbar { height: 4px; }
  .filter-bar::-webkit-scrollbar-track { background: transparent; }
  .filter-bar::-webkit-scrollbar-thumb { background: var(--border); border-radius: 2px; }

  .footer-note {
    text-align: center; font-size: 10px; color: var(--muted);
    margin-top: 20px; line-height: 1.6;
  }
</style>
</head>
<body>
<div class="container">

  <div class="header">
    <h1>💳 台灣信用卡優惠</h1>
    <div class="header-sub">Top 6 信用卡・日本旅遊回饋一覽（2026年9月）</div>
  </div>

  <div class="tips-card">
    <div class="tips-title">💡 日本旅遊小撇步</div>
    <div class="tips-text">
      • 無腦刷：日本消費 2% 以上回饋的信用卡<br>
      • 富邦J卡加碼登錄：8月登錄期為 8/18～8/31<br>
      • 星展eco卡「7.5%活動」已於3月底結束，8月為常態5%<br>
      • 部分加碼有名額限制、月/季回饋上限，記得提早登錄
    </div>
  </div>

  <div class="filter-bar">
    <button class="filter-btn active" onclick="filterCards('all')">全部</button>
    <button class="filter-btn" onclick="filterCards('nomind')">無腦刷</button>
    <button class="filter-btn" onclick="filterCards('travel')">日本旅遊</button>
    <button class="filter-btn" onclick="filterCards('pay')">支付優惠</button>
  </div>

  <div class="card-list" id="cardList"></div>

  <div class="footer-note">
    資料整理自公開網路資訊，實際回饋內容與活動期限請以各銀行官網公告為準。
  </div>

</div>

<script>
  const cardsData = [
    {
      rank: 1,
      name: '富邦J卡',
      issuer: '台北富邦銀行',
      baseReward: '3.0%',
      rewards: '• 日韓泰實體消費 3% 無上限（基本權益，到2026/12/31）\n• 登錄後單筆滿NT$1,000再加碼3%，最高6%（每季回饋上限1,000元）\n• 加碼3%為「每季」登錄一次即可，非每月：Q3(7-9月)登錄期已知為每月20日16:00開放；Q4(10-12月)登錄期官網尚未查到正式公告，比照往例約在10月20日16:00開放\n• Apple Pay儲值日本Suica/PASMO，登錄後最高10%回饋（月上限200元）',
      usage: '日本旅遊：實體消費＋交通卡儲值雙重回饋',
      verdict: '🔴 11/28-12/2屬於Q4，8月的登錄期已過期，出發前務必去官網/App確認10月登錄窗口有沒有開，抓緊登錄',
      tags: ['travel', 'pay']
    },
    {
      rank: 2,
      name: '玉山熊本熊卡',
      issuer: '玉山銀行',
      baseReward: '1.0%',
      rewards: '• 日本消費最高 8.5% 回饋，活動已延長至2026/12/31，完整涵蓋出發時間\n• 免 1.5% 國外交易服務費\n• 指定商店優惠加倍\n• 加碼6%需登錄一次；若2025/12/31前已登錄過，2026年須重新登錄，不會自動延續',
      usage: '日本專刷：免外幣手續費省成本',
      verdict: '💎 8.5%活動確認到12/31都有效，但務必檢查2026年有沒有重新登錄過',
      tags: ['nomind', 'travel']
    },
    {
      rank: 3,
      name: '聯邦吉鶴卡',
      issuer: '聯邦銀行',
      baseReward: '2.5%',
      rewards: '• 日幣實體消費 2.5% 無上限（常態基本權益，確認延續到2026/12/31）\n• 下半年(7-12月)加碼項目已改為「日本三大交通卡(Suica/ICOCA/PASMO)儲值1.5%」，上半年原本的QUICPay一般消費加碼可能沒有延續\n• 新戶日本實體消費加碼3%（僅限新戶，歸戶上限600元，2026/7/1-12/31）',
      usage: '無腦刷：日幣無上限 2.5% 為長期常態回饋',
      verdict: '🌟 基本2.5%確認可用到12月，交通卡儲值加碼記得出發前App確認是否已登錄',
      tags: ['nomind', 'travel']
    },
    {
      rank: 4,
      name: '星展 eco 永續卡',
      issuer: '星展銀行',
      baseReward: '1.0%',
      rewards: '• 日韓泰新美歐指定國家實體消費 5% 回饋（1%基本＋4%加碼，長期常態權益，無到期日）\n• 現金積點需18個月內使用，滿300點才可折抵\n• 分期消費不列入回饋計算\n• 注意：Suica/PASMO等交通卡儲值不適用加碼',
      usage: '旅遊：日本實體消費常態5%回饋',
      verdict: '✈️ 常態5%沒問題；夏天「摘星啟程」把回饋衝到15~23%的加碼活動已在8/31或9/30到期，11月去只會拿到基本5%，不要被舊文章的高倍數誤導',
      tags: ['travel']
    },
    {
      rank: 5,
      name: '台新Richart卡（原FlyGo）',
      issuer: '台新銀行',
      baseReward: '3.3%',
      rewards: '• 已整合改名為「台新Richart卡」，原FlyGo/黑狗卡等舊卡免重辦\n• 需在Richart Life App切換至「玩旅刷」方案，才享海外消費3.3%無上限回饋\n• 查到最新（9月）資料顯示此權益已延長至2027/03/31，涵蓋出發時間\n• 8月底台新把整張卡權益改成「7+1大刷」架構（天天刷/Chill刷/Pay著刷等），「玩旅刷」這個名稱在部分新版說明裡沒再單獨列出，實際名稱以App顯示為準',
      usage: '海外消費：切換「玩旅刷」後3.3%無上限',
      verdict: '✅ 3.3%權益確認可延續到明年3月，但出國前仍建議打開App核對一次目前海外消費對應的方案名稱與費率',
      tags: ['travel', 'pay']
    },
    {
      rank: 6,
      name: '國泰世華CUBE卡',
      issuer: '國泰世華銀行',
      baseReward: '3.3%',
      rewards: '• 切換「趣旅行」權益，海外實體消費最高3.3%小樹點（信用卡）回饋\n• 權益延續至2026/12/31，涵蓋11-12月出發時間\n• 回饋依等級分級：Level 1一般卡友2%、Level 2自動扣繳/App繳費3%、Level 3財富管理貴賓才有3.3%\n• 指定航空公司、旅行社、旅遊平台、海外搭車平台消費同樣適用',
      usage: '海外旅遊：切換「趣旅行」後依等級最高3.3%',
      verdict: '✈️ 出發前務必先在App切到「趣旅行」方案，並確認自己實際等級是2%/3%/3.3%哪一檔',
      tags: ['travel', 'pay']
    }
  ];

  let currentFilter = 'all';

  function filterCards(tag) {
    currentFilter = tag;
    document.querySelectorAll('.filter-btn').forEach(btn => {
      btn.classList.remove('active');
    });
    event.target.classList.add('active');
    renderCards();
  }

  function renderCards() {
    const container = document.getElementById('cardList');
    let filtered = cardsData;

    if (currentFilter !== 'all') {
      filtered = cardsData.filter(card => card.tags.includes(currentFilter));
    }

    if (!filtered.length) {
      container.innerHTML = '<div class="empty"><div class="empty-icon">🔍</div>沒有符合的信用卡</div>';
      return;
    }

    container.innerHTML = filtered.map(card => `
      <div class="card-item">
        <div class="card-header">
          <div class="card-rank">#${card.rank}</div>
          <div>
            <div class="card-name">${card.name}</div>
            <div class="card-issuer">${card.issuer}</div>
          </div>
          <div class="card-badge">${card.baseReward}回饋</div>
        </div>

        <div class="card-rewards">
          <div class="reward-title">💎 回饋詳情</div>
          <div class="reward-detail">${card.rewards.split('\n').join('<br>')}</div>
        </div>

        <div class="card-usage">
          <span class="usage-label">📌 使用情境：</span><br>
          ${card.usage}
        </div>

        <div class="card-verdict">
          ${card.verdict}
        </div>
      </div>
    `).join('');
  }

  renderCards();
</script>
</body>
</html>
