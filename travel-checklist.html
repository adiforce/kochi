<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>出國準備清單</title>
<link href="https://fonts.googleapis.com/css2?family=Zen+Maru+Gothic:wght@400;700;900&family=Noto+Sans+TC:wght@400;700&display=swap" rel="stylesheet">
<style>
  :root {
    --cream: #f3f5f8;
    --pink: #c9dcf0;
    --pink-dark: #2f6fb3;
    --mint: #b8e8d8;
    --mint-dark: #5abf9a;
    --yellow: #fce97a;
    --brown: #1f3350;
    --text: #14233a;
    --muted: #5c708a;
    --border: #d6dee8;
    --shadow: rgba(31,51,80,0.08);
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    font-family: 'Noto Sans TC', sans-serif;
    background: var(--cream);
    color: var(--text);
    min-height: 100vh;
  }

  body::before {
    content: '';
    position: fixed; inset: 0;
    background-image: radial-gradient(circle, #d3dbe6 1px, transparent 1px);
    background-size: 24px 24px;
    opacity: 0.4;
    pointer-events: none;
    z-index: 0;
  }

  .container {
    position: relative; z-index: 1;
    max-width: 480px;
    margin: 0 auto;
    padding: 20px 16px 56px;
  }

  /* ── Header ── */
  .header { text-align: center; padding: 16px 0 18px; }
  .header h1 {
    font-family: 'Zen Maru Gothic', sans-serif;
    font-size: 22px; font-weight: 900; color: var(--brown);
  }
  .header-sub { font-size: 12px; color: var(--muted); margin-top: 4px; }

  /* ── Progress ── */
  .progress-card {
    background: #fff;
    border: 1.5px solid var(--border);
    border-radius: 16px;
    padding: 14px 16px;
    box-shadow: 0 2px 8px var(--shadow);
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
    margin-bottom: 18px;
  }
  .progress-num {
    font-family: 'Zen Maru Gothic', sans-serif;
    font-size: 20px; font-weight: 900; color: var(--pink-dark);
    white-space: nowrap;
  }
  .progress-track {
    flex: 1;
    height: 8px;
    background: var(--cream);
    border: 1px solid var(--border);
    border-radius: 99px;
    overflow: hidden;
  }
  .progress-fill {
    height: 100%; width: 0%;
    background: linear-gradient(90deg, var(--pink), var(--pink-dark));
    transition: width .35s ease;
  }

  /* ── Category card ── */
  .cat {
    background: #fff;
    border: 1.5px solid var(--border);
    border-radius: 18px;
    box-shadow: 0 2px 8px var(--shadow);
    padding: 16px 18px 10px;
    margin-bottom: 16px;
  }
  .cat-head {
    display: flex;
    align-items: center;
    gap: 10px;
    margin-bottom: 6px;
  }
  .cat-index {
    font-family: 'Zen Maru Gothic', sans-serif;
    font-size: 12px; font-weight: 700;
    color: var(--pink-dark);
    background: var(--pink);
    background: rgba(47,111,179,0.15);
    border-radius: 99px;
    padding: 2px 10px;
  }
  .cat-name {
    font-family: 'Zen Maru Gothic', sans-serif;
    font-size: 15px; font-weight: 700; color: var(--brown);
  }


  /* ── 天氣穿搭建議 ── */
  .wx-card .cat-index{background:rgba(232,160,77,.18);color:#cf8830;}
  .wx-refresh{margin-left:auto;font:700 12px/1 inherit;font-family:inherit;color:var(--pink-dark);background:#fff;border:1.5px solid var(--border);border-radius:99px;padding:5px 10px;cursor:pointer;}
  .wx-status{font-size:12px;color:var(--muted);margin:2px 0 8px;}
  .wx-days{display:flex;flex-direction:column;gap:6px;margin-bottom:10px;}
  .wx-day{display:grid;grid-template-columns:92px 1fr auto;gap:4px 10px;align-items:center;background:var(--cream);border:1px solid var(--border);border-radius:12px;padding:8px 10px;}
  .wx-date{font-weight:700;font-size:13px;color:var(--brown);line-height:1.3;}
  .wx-date small{display:block;font-weight:400;font-size:11px;color:var(--muted);}
  .wx-sky{font-size:13px;}
  .wx-temp{font-size:13px;font-weight:700;text-align:right;white-space:nowrap;}
  .wx-temp .hi{color:#e06a4e;} .wx-temp .lo{color:#2f6fb3;}
  .wx-temp small{display:block;font-size:11px;font-weight:400;color:var(--muted);}
  .wx-wear{grid-column:1/-1;font-size:12.5px;color:var(--text);line-height:1.5;border-top:1px dashed var(--border);padding-top:5px;}
  .wx-sum{font-size:13px;line-height:1.6;background:#fff8ee;border:1px dashed #e8a04d;border-radius:12px;padding:8px 12px;margin-bottom:6px;}
  .wx-sub{font-size:12px;font-weight:700;color:var(--pink-dark);margin:10px 0 0;}
  .items li .why{display:block;font-size:12px;color:var(--muted);}

  .items { list-style: none; }
  .items li {
    display: flex;
    align-items: flex-start;
    gap: 10px;
    padding: 9px 2px;
    border-bottom: 1px dashed var(--border);
    font-size: 14px;
    line-height: 1.55;
  }
  .items li:last-child { border-bottom: none; }

  .items input[type="checkbox"] {
    appearance: none;
    -webkit-appearance: none;
    width: 20px; height: 20px; min-width: 20px;
    margin-top: 2px;
    border-radius: 6px;
    border: 2px solid var(--pink-dark);
    background: #fff;
    cursor: pointer;
    position: relative;
    transition: all .15s ease;
  }
  .items input[type="checkbox"]:checked {
    background: var(--pink-dark);
    border-color: var(--pink-dark);
  }
  .items input[type="checkbox"]:checked::after {
    content: "";
    position: absolute;
    left: 5px; top: 1px;
    width: 6px; height: 11px;
    border: solid #fff;
    border-width: 0 2px 2px 0;
    transform: rotate(40deg);
  }

  .items label { cursor: pointer; flex: 1; }
  .items li.checked label {
    color: var(--muted);
    text-decoration: line-through;
    text-decoration-color: rgba(20,35,58,0.5);
  }

  /* ── Notice ── */
  .notice {
    background: #fff8e6;
    border-left: 4px solid var(--yellow);
    border-radius: 0 14px 14px 0;
    padding: 14px 16px;
    margin-bottom: 18px;
  }
  .notice-head {
    display: flex;
    align-items: center;
    gap: 8px;
    font-family: 'Zen Maru Gothic', sans-serif;
    font-weight: 700;
    color: #a67a1a;
    font-size: 13.5px;
    margin-bottom: 8px;
  }
  .notice ul {
    margin: 0;
    padding-left: 18px;
    font-size: 13px;
    line-height: 1.85;
    color: #7a6020;
  }

  /* ── Reset ── */
  .reset-row { display: flex; justify-content: center; }
  .reset-btn {
    background: #fff;
    border: 2px solid var(--border);
    color: var(--muted);
    font-family: 'Noto Sans TC', sans-serif;
    font-size: 12.5px; font-weight: 700;
    padding: 9px 22px;
    border-radius: 99px;
    cursor: pointer;
  }
  .reset-btn:active { background: var(--pink); border-color: var(--pink-dark); color: var(--brown); }
</style>
<link rel="icon" href="favicon.ico" sizes="any">
<link rel="icon" type="image/png" sizes="32x32" href="favicon-32.png">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="theme-color" content="#2f6fb3">
</head>
<body>
<script src="doodle-icons.js"></script>

<div class="container">

  <div class="header">
    <h1>🧳 出國準備清單</h1>
    <p class="header-sub">出發前，一項一項打勾，安心登機</p>
  </div>

  <div class="progress-card">
    <span class="progress-num" id="progressNum">0/0</span>
    <div class="progress-track"><div class="progress-fill" id="progressFill"></div></div>
  </div>


  <div class="cat wx-card" id="wxCard">
    <div class="cat-head">
      <span class="cat-index">🌡️</span><span class="cat-name">高知天氣 × 穿搭建議</span>
      <button class="wx-refresh" id="wxRefresh" type="button">↻ 更新</button>
    </div>
    <div class="wx-status" id="wxStatus">讀取天氣中…</div>
    <div class="wx-days" id="wxDays"></div>
    <div id="wxSum"></div>
    <div class="wx-sub" id="wxSubHead" hidden>依天氣加帶（會隨預報自動調整）</div>
    <ul class="items" id="wxItems"></ul>
  </div>

  <div id="board">

    <div class="cat">
      <div class="cat-head"><span class="cat-index">01</span><span class="cat-name">證件、錢</span></div>
      <ul class="items">
        <li><input type="checkbox" id="c1"><label for="c1">入境審查表(VJW)、先填好出發前QRCODE截圖</label></li>
        <li><input type="checkbox" id="c1b"><label for="c1b">護照、簽證</label></li>
        <li><input type="checkbox" id="c2"><label for="c2">信用卡(機場停車用)、現金、外幣</label></li>
        <li><input type="checkbox" id="c3"><label for="c3">機票、火車票、交通卡</label></li>
        <li><input type="checkbox" id="c4"><label for="c4">住宿單、門票、車票等票券</label></li>
        <li><input type="checkbox" id="c5"><label for="c5">行程表、地圖、購物清單</label></li>
        <li><input type="checkbox" id="c5b"><label for="c5b">零錢包（日本硬幣使用頻率高，單獨收納找零比較方便）</label></li>
      </ul>
    </div>

    <div class="cat">
      <div class="cat-head"><span class="cat-index">02</span><span class="cat-name">電子與隨身用品</span></div>
      <ul class="items">
        <li><input type="checkbox" id="c6"><label for="c6">網路(網卡/分享器)</label></li>
        <li><input type="checkbox" id="c7"><label for="c7">手機(充飽電)、行動電源(最多帶二顆就好，要有清楚標示電量)</label></li>
        <li><input type="checkbox" id="c7b"><label for="c7b">手機繩（防丟，拍照、找路時比較安心）</label></li>
        <li><input type="checkbox" id="c8"><label for="c8">相機、電池、充電器</label></li>
        <li><input type="checkbox" id="c9"><label for="c9">變壓器、轉接頭</label></li>
        <li><input type="checkbox" id="c10"><label for="c10">筆記本、筆</label></li>
        <li><input type="checkbox" id="c11"><label for="c11">暗袋(視情況)</label></li>
      </ul>
    </div>

    <div class="cat">
      <div class="cat-head"><span class="cat-index">03</span><span class="cat-name">藥品與衛生</span></div>
      <ul class="items">
        <li><input type="checkbox" id="c12"><label for="c12">腸胃藥、OK繃、退燒藥、止痛藥、感冒藥</label></li>
        <li><input type="checkbox" id="c13"><label for="c13">平常每天吃的藥、小剪刀(需託運)</label></li>
        <li><input type="checkbox" id="c14"><label for="c14">盥洗用具(牙刷牙膏、洗面乳、洗髮精、護髮乳、沐浴乳、卸妝油)</label></li>
        <li><input type="checkbox" id="c15"><label for="c15">手帕、衛生紙、濕紙巾</label></li>
        <li><input type="checkbox" id="c16"><label for="c16">化妝品、保養品、刮鬍刀、防曬乳</label></li>
      </ul>
    </div>

    <div class="cat">
      <div class="cat-head"><span class="cat-index">04</span><span class="cat-name">衣物與配件</span></div>
      <ul class="items">
        <li><input type="checkbox" id="c17"><label for="c17">睡衣、睡褲</label></li>
        <li><input type="checkbox" id="c18"><label for="c18">拖鞋</label></li>
        <li><input type="checkbox" id="c19"><label for="c19">換洗衣褲、襪子、內衣褲</label></li>
        <li><input type="checkbox" id="c20"><label for="c20">薄外套(飛機上用，建議要帶)</label></li>
        <li><input type="checkbox" id="c21"><label for="c21">雨傘、雨衣、毛帽</label></li>
        <li><input type="checkbox" id="c22"><label for="c22">圍巾、口罩、手套</label></li>
        <li><input type="checkbox" id="c23"><label for="c23">隱形眼鏡、眼鏡、墨鏡</label></li>
      </ul>
    </div>

    <div class="cat">
      <div class="cat-head"><span class="cat-index">05</span><span class="cat-name">收納與出門前</span></div>
      <ul class="items">
        <li><input type="checkbox" id="c24"><label for="c24">塑膠袋(裝髒衣服)、夾鏈袋、垃圾袋(一天一個)</label></li>
        <li><input type="checkbox" id="c25"><label for="c25">帳單繳清、瓦斯關閉、門窗鎖緊</label></li>
      </ul>
    </div>

  </div>

  <div class="notice">
    <div class="notice-head">⚠️ 行李注意事項</div>
    <ul>
      <li>液體類只限 100ml 以下，超過需託運</li>
      <li>噴霧型罐子不能帶(高壓噴霧)，託運也不行</li>
      <li>瑞士小刀要託運</li>
      <li>折傘可以放隨身行李</li>
      <li>只要有電池的東西，都要放隨身行李，不可拖運</li>
      <li>危險物品勿帶(刀、棍、槍、打火機)</li>
    </ul>
  </div>

  <div class="reset-row">
    <button class="reset-btn" id="resetBtn">一鍵全清</button>
  </div>

</div>

<script>
  const STORAGE_KEY = "travel-checklist-state";
  const progressNum = document.getElementById('progressNum');
  const progressFill = document.getElementById('progressFill');
  const allBoxes = () => Array.from(document.querySelectorAll('.items input[type="checkbox"]'));

  function loadState(){
    try{
      const raw = localStorage.getItem(STORAGE_KEY);
      return raw ? JSON.parse(raw) : {};
    }catch(e){ return {}; }
  }
  function saveState(){
    const state = loadState();          // 保留目前沒顯示的天氣項目狀態
    allBoxes().forEach(cb => state[cb.id] = cb.checked);
    try{ localStorage.setItem(STORAGE_KEY, JSON.stringify(state)); }catch(e){}
  }
  function updateProgress(){
    const boxes = allBoxes();
    const total = boxes.length;
    const checked = boxes.filter(cb => cb.checked).length;
    progressNum.textContent = `${checked}/${total}`;
    progressFill.style.width = total ? `${(checked/total)*100}%` : '0%';
  }
  function applyRowState(cb){
    const li = cb.closest('li');
    if(li) li.classList.toggle('checked', cb.checked);
  }
  function bindBox(cb, saved){
    if(cb.dataset.bound) return;
    cb.dataset.bound = '1';
    if(saved[cb.id]) cb.checked = true;
    applyRowState(cb);
    cb.addEventListener('change', () => { applyRowState(cb); updateProgress(); saveState(); });
  }
  function bindAll(){
    const saved = loadState();
    allBoxes().forEach(cb => bindBox(cb, saved));
    updateProgress();
  }
  bindAll();

  document.getElementById('resetBtn').addEventListener('click', () => {
    allBoxes().forEach(cb => { cb.checked = false; applyRowState(cb); });
    try{ localStorage.setItem(STORAGE_KEY, '{}'); }catch(e){}
    updateProgress();
  });

  /* ===== 高知天氣 × 穿搭建議（與行程表共用 Open-Meteo 與快取） ===== */
  const TRIP_DAYS = [
    { date:'2026-11-28', label:'Day1', note:'抵達、市區' },
    { date:'2026-11-29', label:'Day2', note:'日曜市、桂浜海邊' },
    { date:'2026-11-30', label:'Day3', note:'仁淀川自駕' },
    { date:'2026-12-01', label:'Day4', note:'高知城、竹林寺' },
    { date:'2026-12-02', label:'Day5', note:'回程' }
  ];
  const WX_POINTS = {
    default: { lat: 33.5597, lon: 133.5311, name: '高知市' },
    '2026-11-30': { lat: 33.60, lon: 133.20, name: '仁淀川一帶' }
  };
  const WX_TTL = 30 * 60 * 1000;
  const WX_CODES = {
    0:['☀️','晴'], 1:['🌤️','晴時多雲'], 2:['⛅','多雲'], 3:['☁️','陰'],
    45:['🌫️','霧'], 48:['🌫️','霧'],
    51:['🌦️','毛毛雨'], 53:['🌦️','毛毛雨'], 55:['🌦️','毛毛雨'], 56:['🌧️','凍雨'], 57:['🌧️','凍雨'],
    61:['🌧️','小雨'], 63:['🌧️','雨'], 65:['🌧️','大雨'], 66:['🌧️','凍雨'], 67:['🌧️','凍雨'],
    71:['🌨️','小雪'], 73:['🌨️','雪'], 75:['❄️','大雪'], 77:['🌨️','雪粒'],
    80:['🌦️','陣雨'], 81:['🌧️','陣雨'], 82:['⛈️','強陣雨'], 85:['🌨️','陣雪'], 86:['🌨️','陣雪'],
    95:['⛈️','雷雨'], 96:['⛈️','雷雨'], 99:['⛈️','雷雨']
  };
  const SNOW_CODES = [71,73,75,77,85,86];

  async function wxFetchPoint(key, force){
    const ck = 'wx::om::' + key;
    if(!force){
      try {
        const c = JSON.parse(localStorage.getItem(ck) || 'null');
        if(c && Date.now() - c.t < WX_TTL) return c;
      } catch(e) {}
    }
    const pt = WX_POINTS[key];
    const url = 'https://api.open-meteo.com/v1/forecast?latitude=' + pt.lat + '&longitude=' + pt.lon +
      '&daily=weather_code,temperature_2m_max,temperature_2m_min,precipitation_probability_max' +
      '&timezone=Asia%2FTokyo&forecast_days=16';
    const ctrl = new AbortController();
    const timer = setTimeout(() => ctrl.abort(), 5000);
    let data;
    try {
      const res = await fetch(url, { cache: 'no-store', signal: ctrl.signal });
      if(!res.ok) throw new Error('HTTP ' + res.status);
      const j = await res.json();
      data = { t: Date.now(), daily: j.daily, via: 'live' };
    } catch(err){
      const r2 = await fetch('weather.json?t=' + Date.now(), { cache: 'no-store' });
      if(!r2.ok) throw new Error('weather.json HTTP ' + r2.status);
      const wj = await r2.json();
      const p = wj.points && wj.points[key];
      if(!p || !p.daily) throw new Error('weather.json 還沒有資料');
      data = { t: wj.updated ? new Date(wj.updated).getTime() : Date.now(), daily: p.daily, via: 'json' };
    } finally {
      clearTimeout(timer);
    }
    try { localStorage.setItem(ck, JSON.stringify(data)); } catch(e) {}
    return data;
  }

  // 依當天最低／最高溫給一句穿搭
  function outfitFor(lo, hi, rain){
    let base;
    if(lo <= 3) base = '發熱衣＋毛衣／刷毛＋羽絨或厚大衣';
    else if(lo <= 7) base = '發熱衣＋毛衣或刷毛＋防風保暖外套';
    else if(lo <= 11) base = '長袖＋針織衫＋防風外套';
    else if(lo <= 15) base = '長袖＋薄外套';
    else base = '短袖＋薄長袖';
    const tips = [];
    if(hi - lo >= 9) tips.push(`中午 ${Math.round(hi)}° 會熱，內層穿薄一點方便脫`);
    if(rain >= 50) tips.push('降雨機率高，帶傘＋穿防水鞋');
    else if(rain >= 30) tips.push('可能下雨，帶折傘');
    return base + (tips.length ? '；' + tips.join('；') : '');
  }

  function suggestItems(days){
    const lo = Math.min(...days.map(d => d.lo));
    const hi = Math.max(...days.map(d => d.hi));
    const rain = Math.max(...days.map(d => d.rain));
    const swing = Math.max(...days.map(d => d.hi - d.lo));
    const snow = days.some(d => SNOW_CODES.includes(d.code));
    const items = [];
    const add = (id, text, why) => items.push({ id: 'wx-' + id, text, why });

    if(lo <= 5) add('down', '羽絨外套或厚大衣', `最低 ${Math.round(lo)}°，早晚接近台灣寒流等級`);
    else if(lo <= 11) add('jacket', '防風保暖外套（可擋風的夾克、薄羽絨）', `最低 ${Math.round(lo)}°，早晚偏冷`);
    else add('light', '薄外套或針織外套', `最低 ${Math.round(lo)}°`);
    if(lo <= 9) add('heat', '發熱衣 2–3 件（Heattech 之類）', '早上出門、晚上逛街最需要');
    if(lo <= 12) add('knit', '毛衣或刷毛上衣 1–2 件', '室內有暖氣，選好穿脫的');
    if(hi >= 17 && swing >= 9) add('layer', '短袖或薄長袖當內層（洋蔥式穿法）', `白天最高 ${Math.round(hi)}°、日夜溫差約 ${Math.round(swing)}°`);
    if(lo <= 6) add('warm', '圍巾、手套、毛帽', '早晚騎車、等公車、海邊風大時用得到');
    if(lo <= 8) add('pants', '厚一點的長褲（或內搭褲）', '下半身保暖常被忽略');
    if(rain >= 50) add('rain', '折傘＋防潑水外套', `最高降雨機率 ${rain}%`);
    else if(rain >= 30) add('umbrella', '折傘', `最高降雨機率 ${rain}%`);
    if(rain >= 50 || snow) add('shoes', '防水、防滑的好走鞋', snow ? '預報有降雪' : '下雨天走沈下橋、石階比較安全');
    const d3 = days.find(d => d.date === '2026-11-30');
    if(d3 && d3.lo <= 8) add('niyodo', '11/30 仁淀川多帶一件保暖層放車上', `山區河谷最低 ${Math.round(d3.lo)}°，比市區冷`);
    add('lip', '護唇膏、乳液', '天冷乾燥，飯店暖氣也會讓皮膚變乾');
    return { items, lo, hi, rain };
  }

  function md(dateStr){
    const [y, m, d] = dateStr.split('-').map(Number);
    const w = '日一二三四五六'[new Date(y, m - 1, d).getDay()];
    return `${m}/${d}（${w}）`;
  }

  async function loadWx(force){
    const st = document.getElementById('wxStatus');
    st.textContent = '讀取天氣中…';
    try {
      const keys = [...new Set(TRIP_DAYS.map(d => WX_POINTS[d.date] ? d.date : 'default'))];
      const res = {};
      await Promise.all(keys.map(async k => { res[k] = await wxFetchPoint(k, force); }));
      const days = [];
      TRIP_DAYS.forEach(td => {
        const k = WX_POINTS[td.date] ? td.date : 'default';
        const dd = res[k].daily;
        const i = dd.time.indexOf(td.date);
        if(i < 0) return;
        days.push({ ...td, place: WX_POINTS[k].name, code: dd.weather_code[i],
          hi: dd.temperature_2m_max[i], lo: dd.temperature_2m_min[i],
          rain: dd.precipitation_probability_max ? (dd.precipitation_probability_max[i] ?? 0) : 0 });
      });
      if(!days.length){
        st.textContent = '出發日還超出 16 天預報範圍，越接近出發日就會出現建議。';
        return;
      }
      const t = new Date(Math.min(...Object.values(res).map(r => r.t)));
      const via = Object.values(res).some(r => r.via === 'json') ? '（備援資料）' : '';
      st.textContent = `Open-Meteo 預報${via}，更新於 ${t.getMonth()+1}/${t.getDate()} ${String(t.getHours()).padStart(2,'0')}:${String(t.getMinutes()).padStart(2,'0')}`
        + (days.length < TRIP_DAYS.length ? `；還有 ${TRIP_DAYS.length - days.length} 天超出預報範圍` : '');

      document.getElementById('wxDays').innerHTML = days.map(d => {
        const [ic, desc] = WX_CODES[d.code] || ['🌡️', ''];
        return `<div class="wx-day">
          <div class="wx-date">${md(d.date)}<small>${d.label}・${d.note}</small></div>
          <div class="wx-sky">${ic} ${desc}${d.place !== '高知市' ? `<br><small style="color:var(--muted)">${d.place}</small>` : ''}</div>
          <div class="wx-temp"><span class="hi">${Math.round(d.hi)}°</span> / <span class="lo">${Math.round(d.lo)}°</span><small>☔ ${d.rain}%</small></div>
          <div class="wx-wear">👕 ${outfitFor(d.lo, d.hi, d.rain)}</div>
        </div>`;
      }).join('');

      const s = suggestItems(days);
      document.getElementById('wxSum').innerHTML =
        `<div class="wx-sum">旅程期間氣溫約 <b>${Math.round(s.lo)}°～${Math.round(s.hi)}°</b>，最高降雨機率 <b>${s.rain}%</b>。下面是依預報建議加帶的衣物，勾選會一起算進進度。</div>`;
      document.getElementById('wxSubHead').hidden = false;
      document.getElementById('wxItems').innerHTML = s.items.map(it =>
        `<li><input type="checkbox" id="${it.id}"><label for="${it.id}">${it.text}<span class="why">${it.why}</span></label></li>`).join('');
      bindAll();
    } catch(err){
      st.textContent = '連不上天氣資料，點「↻ 更新」再試一次。';
      console.warn(err);
    }
  }
  document.getElementById('wxRefresh').addEventListener('click', () => loadWx(true));
  loadWx(false);
</script>
