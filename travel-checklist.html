<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>出國準備清單</title>
<link href="https://fonts.googleapis.com/css2?family=Zen+Maru+Gothic:wght@400;700;900&family=Noto+Sans+TC:wght@400;700&display=swap" rel="stylesheet">
<style>
  :root {
    --cream: #fdf6ee;
    --pink: #f5b8c8;
    --pink-dark: #e8849a;
    --mint: #b8e8d8;
    --mint-dark: #5abf9a;
    --yellow: #fce97a;
    --brown: #7a4f3a;
    --text: #3d2b1f;
    --muted: #a07060;
    --border: #ead8c8;
    --shadow: rgba(122,79,58,0.08);
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    font-family: 'Noto Sans TC', sans-serif;
    background: var(--cream);
    color: var(--text);
    min-height: 100vh;
  }

  body::before {
    content: '';
    position: fixed; inset: 0;
    background-image: radial-gradient(circle, #e8d5c4 1px, transparent 1px);
    background-size: 24px 24px;
    opacity: 0.4;
    pointer-events: none;
    z-index: 0;
  }

  .container {
    position: relative; z-index: 1;
    max-width: 480px;
    margin: 0 auto;
    padding: 20px 16px 56px;
  }

  /* ── Header ── */
  .header { text-align: center; padding: 16px 0 18px; }
  .header h1 {
    font-family: 'Zen Maru Gothic', sans-serif;
    font-size: 22px; font-weight: 900; color: var(--brown);
  }
  .header-sub { font-size: 12px; color: var(--muted); margin-top: 4px; }

  /* ── Progress ── */
  .progress-card {
    background: #fff;
    border: 1.5px solid var(--border);
    border-radius: 16px;
    padding: 14px 16px;
    box-shadow: 0 2px 8px var(--shadow);
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
    margin-bottom: 18px;
  }
  .progress-num {
    font-family: 'Zen Maru Gothic', sans-serif;
    font-size: 20px; font-weight: 900; color: var(--pink-dark);
    white-space: nowrap;
  }
  .progress-track {
    flex: 1;
    height: 8px;
    background: var(--cream);
    border: 1px solid var(--border);
    border-radius: 99px;
    overflow: hidden;
  }
  .progress-fill {
    height: 100%; width: 0%;
    background: linear-gradient(90deg, var(--pink), var(--pink-dark));
    transition: width .35s ease;
  }

  /* ── Category card ── */
  .cat {
    background: #fff;
    border: 1.5px solid var(--border);
    border-radius: 18px;
    box-shadow: 0 2px 8px var(--shadow);
    padding: 16px 18px 10px;
    margin-bottom: 16px;
  }
  .cat-head {
    display: flex;
    align-items: center;
    gap: 10px;
    margin-bottom: 6px;
  }
  .cat-index {
    font-family: 'Zen Maru Gothic', sans-serif;
    font-size: 12px; font-weight: 700;
    color: var(--pink-dark);
    background: var(--pink);
    background: rgba(232,132,154,0.15);
    border-radius: 99px;
    padding: 2px 10px;
  }
  .cat-name {
    font-family: 'Zen Maru Gothic', sans-serif;
    font-size: 15px; font-weight: 700; color: var(--brown);
  }

  .items { list-style: none; }
  .items li {
    display: flex;
    align-items: flex-start;
    gap: 10px;
    padding: 9px 2px;
    border-bottom: 1px dashed var(--border);
    font-size: 14px;
    line-height: 1.55;
  }
  .items li:last-child { border-bottom: none; }

  .items input[type="checkbox"] {
    appearance: none;
    -webkit-appearance: none;
    width: 20px; height: 20px; min-width: 20px;
    margin-top: 2px;
    border-radius: 6px;
    border: 2px solid var(--pink-dark);
    background: #fff;
    cursor: pointer;
    position: relative;
    transition: all .15s ease;
  }
  .items input[type="checkbox"]:checked {
    background: var(--pink-dark);
    border-color: var(--pink-dark);
  }
  .items input[type="checkbox"]:checked::after {
    content: "";
    position: absolute;
    left: 5px; top: 1px;
    width: 6px; height: 11px;
    border: solid #fff;
    border-width: 0 2px 2px 0;
    transform: rotate(40deg);
  }

  .items label { cursor: pointer; flex: 1; }
  .items li.checked label {
    color: var(--muted);
    text-decoration: line-through;
    text-decoration-color: rgba(160,112,96,0.5);
  }

  /* ── Notice ── */
  .notice {
    background: #fff8e6;
    border-left: 4px solid var(--yellow);
    border-radius: 0 14px 14px 0;
    padding: 14px 16px;
    margin-bottom: 18px;
  }
  .notice-head {
    display: flex;
    align-items: center;
    gap: 8px;
    font-family: 'Zen Maru Gothic', sans-serif;
    font-weight: 700;
    color: #a67a1a;
    font-size: 13.5px;
    margin-bottom: 8px;
  }
  .notice ul {
    margin: 0;
    padding-left: 18px;
    font-size: 13px;
    line-height: 1.85;
    color: #7a6020;
  }

  /* ── Reset ── */
  .reset-row { display: flex; justify-content: center; }
  .reset-btn {
    background: #fff;
    border: 2px solid var(--border);
    color: var(--muted);
    font-family: 'Noto Sans TC', sans-serif;
    font-size: 12.5px; font-weight: 700;
    padding: 9px 22px;
    border-radius: 99px;
    cursor: pointer;
  }
  .reset-btn:active { background: var(--pink); border-color: var(--pink-dark); color: var(--brown); }
</style>
</head>
<body>

<div class="container">

  <div class="header">
    <h1>🧳 出國準備清單</h1>
    <p class="header-sub">出發前，一項一項打勾，安心登機</p>
  </div>

  <div class="progress-card">
    <span class="progress-num" id="progressNum">0/0</span>
    <div class="progress-track"><div class="progress-fill" id="progressFill"></div></div>
  </div>

  <div id="board">

    <div class="cat">
      <div class="cat-head"><span class="cat-index">01</span><span class="cat-name">證件、錢</span></div>
      <ul class="items">
        <li><input type="checkbox" id="c1"><label for="c1">入境審查表(VJW)、先填好出發前QRCODE截圖</label></li>
        <li><input type="checkbox" id="c1b"><label for="c1b">護照、簽證</label></li>
        <li><input type="checkbox" id="c2"><label for="c2">信用卡(機場停車用)、現金、外幣</label></li>
        <li><input type="checkbox" id="c3"><label for="c3">機票、火車票、交通卡</label></li>
        <li><input type="checkbox" id="c4"><label for="c4">住宿單、門票、車票等票券</label></li>
        <li><input type="checkbox" id="c5"><label for="c5">行程表、地圖、購物清單</label></li>
        <li><input type="checkbox" id="c5b"><label for="c5b">零錢包（日本硬幣使用頻率高，單獨收納找零比較方便）</label></li>
      </ul>
    </div>

    <div class="cat">
      <div class="cat-head"><span class="cat-index">02</span><span class="cat-name">電子與隨身用品</span></div>
      <ul class="items">
        <li><input type="checkbox" id="c6"><label for="c6">網路(網卡/分享器)</label></li>
        <li><input type="checkbox" id="c7"><label for="c7">手機(充飽電)、行動電源(最多帶二顆就好，要有清楚標示電量)</label></li>
        <li><input type="checkbox" id="c7b"><label for="c7b">手機繩（防丟，拍照、找路時比較安心）</label></li>
        <li><input type="checkbox" id="c8"><label for="c8">相機、電池、充電器</label></li>
        <li><input type="checkbox" id="c9"><label for="c9">變壓器、轉接頭</label></li>
        <li><input type="checkbox" id="c10"><label for="c10">筆記本、筆</label></li>
        <li><input type="checkbox" id="c11"><label for="c11">暗袋(視情況)</label></li>
      </ul>
    </div>

    <div class="cat">
      <div class="cat-head"><span class="cat-index">03</span><span class="cat-name">藥品與衛生</span></div>
      <ul class="items">
        <li><input type="checkbox" id="c12"><label for="c12">腸胃藥、OK繃、退燒藥、止痛藥、感冒藥</label></li>
        <li><input type="checkbox" id="c13"><label for="c13">平常每天吃的藥、小剪刀(需託運)</label></li>
        <li><input type="checkbox" id="c14"><label for="c14">盥洗用具(牙刷牙膏、洗面乳、洗髮精、護髮乳、沐浴乳、卸妝油)</label></li>
        <li><input type="checkbox" id="c15"><label for="c15">手帕、衛生紙、濕紙巾</label></li>
        <li><input type="checkbox" id="c16"><label for="c16">化妝品、保養品、刮鬍刀、防曬乳</label></li>
      </ul>
    </div>

    <div class="cat">
      <div class="cat-head"><span class="cat-index">04</span><span class="cat-name">衣物與配件</span></div>
      <ul class="items">
        <li><input type="checkbox" id="c17"><label for="c17">睡衣、睡褲</label></li>
        <li><input type="checkbox" id="c18"><label for="c18">拖鞋</label></li>
        <li><input type="checkbox" id="c19"><label for="c19">換洗衣褲、襪子、內衣褲</label></li>
        <li><input type="checkbox" id="c20"><label for="c20">薄外套(飛機上用，建議要帶)</label></li>
        <li><input type="checkbox" id="c21"><label for="c21">雨傘、雨衣、毛帽</label></li>
        <li><input type="checkbox" id="c22"><label for="c22">圍巾、口罩、手套</label></li>
        <li><input type="checkbox" id="c23"><label for="c23">隱形眼鏡、眼鏡、墨鏡</label></li>
      </ul>
    </div>

    <div class="cat">
      <div class="cat-head"><span class="cat-index">05</span><span class="cat-name">收納與出門前</span></div>
      <ul class="items">
        <li><input type="checkbox" id="c24"><label for="c24">塑膠袋(裝髒衣服)、夾鏈袋、垃圾袋(一天一個)</label></li>
        <li><input type="checkbox" id="c25"><label for="c25">帳單繳清、瓦斯關閉、門窗鎖緊</label></li>
      </ul>
    </div>

  </div>

  <div class="notice">
    <div class="notice-head">⚠️ 行李注意事項</div>
    <ul>
      <li>液體類只限 100ml 以下，超過需託運</li>
      <li>噴霧型罐子不能帶(高壓噴霧)，託運也不行</li>
      <li>瑞士小刀要託運</li>
      <li>折傘可以放隨身行李</li>
      <li>只要有電池的東西，都要放隨身行李，不可拖運</li>
      <li>危險物品勿帶(刀、棍、槍、打火機)</li>
    </ul>
  </div>

  <div class="reset-row">
    <button class="reset-btn" id="resetBtn">一鍵全清</button>
  </div>

</div>

<script>
  const STORAGE_KEY = "travel-checklist-state";
  const checkboxes = Array.from(document.querySelectorAll('.items input[type="checkbox"]'));
  const progressNum = document.getElementById('progressNum');
  const progressFill = document.getElementById('progressFill');

  function loadState(){
    try{
      const raw = localStorage.getItem(STORAGE_KEY);
      return raw ? JSON.parse(raw) : {};
    }catch(e){ return {}; }
  }

  function saveState(){
    const state = {};
    checkboxes.forEach(cb => state[cb.id] = cb.checked);
    try{ localStorage.setItem(STORAGE_KEY, JSON.stringify(state)); }catch(e){}
  }

  function updateProgress(){
    const total = checkboxes.length;
    const checked = checkboxes.filter(cb => cb.checked).length;
    progressNum.textContent = `${checked}/${total}`;
    progressFill.style.width = total ? `${(checked/total)*100}%` : '0%';
  }

  function applyRowState(cb){
    const li = cb.closest('li');
    if(li) li.classList.toggle('checked', cb.checked);
  }

  const saved = loadState();
  checkboxes.forEach(cb => {
    if(saved[cb.id]) cb.checked = true;
    applyRowState(cb);
    cb.addEventListener('change', () => {
      applyRowState(cb);
      updateProgress();
      saveState();
    });
  });
  updateProgress();

  document.getElementById('resetBtn').addEventListener('click', () => {
    checkboxes.forEach(cb => { cb.checked = false; applyRowState(cb); });
    updateProgress();
    saveState();
  });
</script>

</body>
</html>
