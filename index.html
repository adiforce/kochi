<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>我的日本工具箱</title>
<link href="https://fonts.googleapis.com/css2?family=Zen+Maru+Gothic:wght@400;700;900&family=Noto+Sans+TC:wght@400;700&display=swap" rel="stylesheet">
<style>
  :root {
    --pink-dark: #2f6fb3;
    --pink: #c9dcf0;
    --cream: #f3f5f8;
    --brown: #1f3350;
    --tab-h: 62px;
    --header-h: 52px;
    --now-h: 36px;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body {
    height: 100%;
    font-family: 'Noto Sans TC', sans-serif;
    background: #e6ebf1;
    overflow: hidden;
  }
  /* ── Header ── */
  .app-header {
    position: fixed;
    top: 0; left: 0; right: 0;
    height: var(--header-h);
    background: var(--pink-dark);
    display: flex;
    align-items: center;
    justify-content: center;
    z-index: 200;
    box-shadow: 0 2px 12px rgba(20,35,58,0.2);
  }
  .app-title {
    font-family: 'Zen Maru Gothic', sans-serif;
    font-size: 17px;
    font-weight: 900;
    color: white;
    letter-spacing: 1px;
  }
  /* ── 進行中行程列（點了跳到行程表該站） ── */
  .now-bar {
    position: fixed;
    top: var(--header-h); left: 0; right: 0;
    height: var(--now-h);
    z-index: 190;
    display: none;
    align-items: center;
    gap: 8px;
    padding: 0 12px;
    border: none;
    border-bottom: 1.5px solid var(--pink);
    background: #fff;
    color: var(--brown);
    font-family: 'Noto Sans TC', sans-serif;
    font-size: 13px;
    text-align: left;
    cursor: pointer;
    -webkit-tap-highlight-color: transparent;
  }
  body.has-now .now-bar { display: flex; }
  body.has-now .iframe-wrap { top: calc(var(--header-h) + var(--now-h)); }
  .now-bar:active { background: var(--cream); }
  .now-tag {
    flex-shrink: 0;
    display: inline-flex;
    align-items: center;
    gap: 5px;
    padding: 2px 8px;
    border-radius: 999px;
    background: #e3f1dc;
    color: #3f7d31;
    font-size: 11px;
    font-weight: 700;
  }
  .now-tag.next { background: var(--pink); color: var(--pink-dark); }
  .now-dot { width: 7px; height: 7px; border-radius: 50%; background: #5aa84a; animation: nowPulse 1.4s ease-in-out infinite; }
  .now-tag.next .now-dot { display: none; }
  @keyframes nowPulse { 0%,100% { opacity: 1; } 50% { opacity: .3; } }
  .now-name { flex: 1; min-width: 0; font-weight: 700; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .now-time { flex-shrink: 0; font-size: 11.5px; opacity: .6; }
  .now-go { flex-shrink: 0; font-size: 18px; color: var(--pink-dark); opacity: .7; }
  /* ── iframe ── */
  .iframe-wrap {
    position: fixed;
    top: var(--header-h);
    bottom: var(--tab-h);
    left: 0; right: 0;
  }
  .iframe-wrap iframe {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    border: none;
    display: none;
    background: var(--cream);
  }
  .iframe-wrap iframe.active {
    display: block;
  }
  /* ── Tab Bar ── */
  .tab-bar {
    position: fixed;
    bottom: 0; left: 0; right: 0;
    height: var(--tab-h);
    background: white;
    border-top: 2px solid var(--pink);
    display: flex;
    z-index: 200;
    box-shadow: 0 -3px 14px rgba(20,35,58,0.10);
    padding-bottom: env(safe-area-inset-bottom, 0);
  }
  .tab-btn {
    flex: 1;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 3px;
    cursor: pointer;
    border: none;
    background: none;
    color: #93a4b8;
    transition: color 0.15s;
    position: relative;
    -webkit-tap-highlight-color: transparent;
  }
  .tab-btn .icon { font-size: 22px; line-height: 1; }
  .tab-btn .label { font-size: 10px; font-weight: 700; font-family: 'Noto Sans TC', sans-serif; }
  .tab-btn.active { color: var(--pink-dark); }
  .tab-btn.active::after {
    content: '';
    position: absolute;
    top: 0; left: 25%; right: 25%;
    height: 3px;
    background: var(--pink-dark);
    border-radius: 0 0 4px 4px;
  }
  /* ── 更多選單 ── */
  .more-overlay {
    display: none;
    position: fixed;
    inset: 0;
    z-index: 300;
    background: rgba(20,35,58,0.3);
  }
  .more-overlay.show { display: block; }
  .more-sheet {
    position: absolute;
    bottom: var(--tab-h);
    left: 0; right: 0;
    background: white;
    border-radius: 20px 20px 0 0;
    padding: 16px 16px 8px;
    box-shadow: 0 -4px 24px rgba(20,35,58,0.15);
    animation: sheetUp 0.22s ease;
  }
  @keyframes sheetUp {
    from { transform: translateY(100%); }
    to   { transform: translateY(0); }
  }
  .more-sheet-title {
    font-family: 'Zen Maru Gothic', sans-serif;
    font-size: 12px; font-weight: 700; color: #93a4b8;
    text-align: center; margin-bottom: 14px;
    letter-spacing: 2px;
  }
  .more-grid {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 8px;
    padding-bottom: 8px;
  }
  .more-item {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 6px;
    padding: 14px 8px;
    border-radius: 14px;
    background: var(--cream);
    border: 1.5px solid #d6dee8;
    cursor: pointer;
    -webkit-tap-highlight-color: transparent;
    transition: all 0.15s;
  }
  .more-item:active { background: var(--pink); border-color: var(--pink-dark); }
  .more-item .more-icon { font-size: 26px; line-height: 1; }
  .more-item .more-label {
    font-size: 10px; font-weight: 700;
    color: var(--brown);
    font-family: 'Noto Sans TC', sans-serif;
    text-align: center;
  }
  .more-item.active-page {
    background: #eaf1f9;
    border-color: var(--pink-dark);
  }
  .more-item.active-page .more-label { color: var(--pink-dark); }
  /* ── iOS 加入主畫面提示 ── */
  .a2hs-banner {
    position: fixed;
    left: 12px; right: 12px;
    bottom: calc(var(--tab-h) + env(safe-area-inset-bottom, 0) + 10px);
    background: white;
    border: 1.5px solid var(--pink);
    border-radius: 16px;
    box-shadow: 0 6px 20px rgba(20,35,58,0.18);
    padding: 12px 14px;
    display: none;
    align-items: center;
    gap: 10px;
    z-index: 300;
    font-family: 'Noto Sans TC', sans-serif;
  }
  .a2hs-banner.show { display: flex; }
  .a2hs-banner .a2hs-icon { font-size: 26px; flex-shrink: 0; }
  .a2hs-banner .a2hs-text { flex: 1; font-size: 12.5px; color: var(--brown); line-height: 1.5; }
  .a2hs-banner .a2hs-text b { color: var(--pink-dark); }
  .a2hs-banner .a2hs-share { display: inline-block; font-size: 14px; }
  .a2hs-banner .a2hs-close {
    background: none; border: none; font-size: 18px; color: var(--brown);
    opacity: .5; padding: 4px; flex-shrink: 0; cursor: pointer;
  }
</style>
<link rel="icon" href="favicon.ico" sizes="any">
<link rel="icon" type="image/png" sizes="32x32" href="favicon-32.png">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#2f6fb3">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="日本工具箱">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
</head>
<body>
<script src="doodle-icons.js"></script>
<!-- Header -->
<header class="app-header">
  <div class="app-title">日本工具箱</div>
</header>
<!-- 進行中行程 -->
<button class="now-bar" id="nowBar" type="button" onclick="goToNowStop()" aria-label="跳到行程表目前的行程">
  <span class="now-tag" id="nowTag"><span class="now-dot"></span><span id="nowTagText">進行中</span></span>
  <span class="now-name" id="nowName"></span>
  <span class="now-time" id="nowTime"></span>
  <span class="now-go">›</span>
</button>
<!-- iframes -->
<div class="iframe-wrap">
  <iframe id="frame-0" src="coupon.html"></iframe>
  <iframe id="frame-1" src="receipt.html"></iframe>
  <iframe id="frame-2" src="product-check.html"></iframe>
  <iframe id="frame-3" src="coupon.html"></iframe>
  <iframe id="frame-4" src="anime-events.html"></iframe>
  <iframe id="frame-5" src="creditcard.html"></iframe>
  <iframe id="frame-6" src="jpyrate.html"></iframe>
  <iframe id="frame-7" src="kakeibo2.html"></iframe>
  <iframe id="frame-8" src="travel-list.html"></iframe>
  <iframe id="frame-9" src="travel-checklist.html"></iframe>
  <iframe id="frame-10" src="travel-plan.html"></iframe>
  <iframe id="frame-11" src="hotel-info.html"></iframe>
</div>
<!-- Tab Bar（5個主要） -->
<nav class="tab-bar">
  <button class="tab-btn" data-idx="6" onclick="switchTab(6)">
    <span class="icon">💱</span>
    <span class="label">匯率</span>
  </button>
  <button class="tab-btn" data-idx="7" onclick="switchTab(7)">
    <span class="icon">💴</span>
    <span class="label">記帳</span>
  </button>
  <button class="tab-btn" data-idx="1" onclick="switchTab(1)">
    <span class="icon">🧾</span>
    <span class="label">發票掃描</span>
  </button>
  <button class="tab-btn" data-idx="2" onclick="switchTab(2)">
    <span class="more-icon">🔍</span>
    <span class="more-label">查價</span>
  </button>
  <button class="tab-btn" data-idx="more" onclick="toggleMore()">
    <span class="icon">⋯</span>
    <span class="label">更多</span>
  </button>
</nav>
<!-- 更多選單 -->
<div class="more-overlay" id="moreOverlay" onclick="closeMore()">
  <div class="more-sheet" onclick="event.stopPropagation()">
    <div class="more-sheet-title">更多工具</div>
    <div class="more-grid">
      <div class="more-item" data-idx="8" onclick="switchTabFromMore(8)">
        <span class="more-icon">📸</span>
        <span class="more-label">地點清單</span>
      </div>
      <div class="more-item" data-idx="3" onclick="switchTabFromMore(3)">
        <span class="more-icon">🎫</span>
        <span class="more-label">優惠券</span>
      </div>
      <div class="more-item" data-idx="5" onclick="switchTabFromMore(5)">
        <span class="more-icon">💳</span>
        <span class="more-label">卡片優惠</span>
      </div>
      <div class="more-item" data-idx="9" onclick="switchTabFromMore(9)">
        <span class="more-icon">🧩</span>
        <span class="more-label">行李確認</span>
      </div>
      <div class="more-item" data-idx="10" onclick="switchTabFromMore(10)">
        <span class="more-icon">📅</span>
        <span class="more-label">行程</span>
      </div>
      <div class="more-item" data-idx="11" onclick="switchTabFromMore(11)">
        <span class="more-icon">🏨</span>
        <span class="more-label">飯店資訊</span>
      </div>
    </div>
  </div>
</div>
<!-- iOS 加入主畫面提示 -->
<div class="a2hs-banner" id="a2hsBanner">
  <div class="a2hs-text">將本站加入<b>主畫面</b>，開啟像 App 一樣方便：點下方分享鍵 <span class="a2hs-share">⬆️</span> → 「加入主畫面」</div>
  <button class="a2hs-close" onclick="dismissA2HS()">✕</button>
</div>
<script>
  const LAST_TAB_KEY = 'japan-toolbox-tab';
  const PLAN_IDX = 10;   // 行程表 frame
  let nowData = null;    // 行程表推來的進行中／下一站
  let current = parseInt(localStorage.getItem(LAST_TAB_KEY) || '0');
  const frames = document.querySelectorAll('.iframe-wrap iframe');
  const tabBtns = document.querySelectorAll('.tab-bar .tab-btn');
  // 主要 tab 對應的 frame index
  const mainTabs = [0, 6, 2, 1]; // 採購、匯率、查價、發票
  function switchTab(idx) {
    // 切換 iframe
    frames.forEach((f, i) => f.classList.toggle('active', i === idx));
    // 更新主 tab 按鈕狀態
    tabBtns.forEach(btn => {
      const btnIdx = btn.dataset.idx;
      if (btnIdx === 'more') {
        btn.classList.remove('active');
      } else {
        btn.classList.toggle('active', parseInt(btnIdx) === idx);
      }
    });
    // 更新更多選單裡的狀態
    document.querySelectorAll('.more-item').forEach(item => {
      item.classList.toggle('active-page', parseInt(item.dataset.idx) === idx);
    });
    current = idx;
    localStorage.setItem(LAST_TAB_KEY, idx);
    renderNowBar();
  }
  function switchTabFromMore(idx) {
    closeMore();
    switchTab(idx);
    // 更多按鈕保持 active 狀態（因為目前頁面是「更多」裡的）
    tabBtns.forEach(btn => {
      if (btn.dataset.idx === 'more') btn.classList.add('active');
      else btn.classList.remove('active');
    });
  }
  function toggleMore() {
    const overlay = document.getElementById('moreOverlay');
    overlay.classList.toggle('show');
  }
  function closeMore() {
    document.getElementById('moreOverlay').classList.remove('show');
  }
  // ── 網址深連結（#0 ~ #8，對應 frame 編號）──
  function getHashTab() {
    const raw = location.hash.replace('#', '').trim();
    const n = parseInt(raw, 10);
    if (!isNaN(n) && n >= 0 && n < frames.length) return n;
    return null;
  }
  // 切到指定頁，並同步更新 tab bar / 更多選單的選中樣式
  function activateTab(idx) {
    switchTab(idx);
    if (!mainTabs.includes(idx)) {
      tabBtns.forEach(btn => {
        if (btn.dataset.idx === 'more') btn.classList.add('active');
        else btn.classList.remove('active');
      });
    }
  }
  // 還原上次開的頁籤，但網址列有指定 #數字 時，以網址為優先
  const hashTab = getHashTab();
  if (hashTab !== null) current = hashTab;
  activateTab(current);
  // 頁面開著時如果網址 hash 被改變（例如手動改網址列 #8），即時切換，不用重整
  window.addEventListener('hashchange', () => {
    const t = getHashTab();
    if (t !== null) activateTab(t);
  });
  // ── 進行中行程列：資料由行程表（frame-10）推過來 ──
  function renderNowBar() {
    const bar = document.getElementById('nowBar');
    if (!bar) return;
    const item = nowData && (nowData.current || nowData.next);
    // 行程表自己就有目前狀態，在那頁不重複顯示；行程全部結束也不顯示
    const show = !!item && current !== PLAN_IDX;
    document.body.classList.toggle('has-now', show);
    if (!item) return;
    const live = !!nowData.current;
    document.getElementById('nowTag').classList.toggle('next', !live);
    document.getElementById('nowTagText').textContent = live ? '進行中' : '下一站';
    document.getElementById('nowName').textContent = item.name;
    const t = String(item.time || '').replace(/^[^\d]*/, '');
    document.getElementById('nowTime').textContent = live ? t : [String(item.date || '').replace(/^\d{4}\//, ''), t].filter(Boolean).join(' ');
  }
  function goToNowStop() {
    activateTab(PLAN_IDX);
    const w = frames[PLAN_IDX].contentWindow;
    // 等 iframe 顯示出來、版面算好再定位
    requestAnimationFrame(() => requestAnimationFrame(() => {
      const btn = w && w.document.getElementById('locateNow');
      if (btn) btn.click();
    }));
  }
  window.addEventListener('message', ev => {
    if (ev.origin !== location.origin || !ev.data || ev.data.type !== 'kochi-now') return;
    nowData = ev.data.data;
    renderNowBar();
  });
  frames[PLAN_IDX].addEventListener('load', () => {
    try { nowData = frames[PLAN_IDX].contentWindow.kochiNow || nowData; } catch (e) {}
    renderNowBar();
  });

  // ── iOS「加入主畫面」提示 ──
  (function () {
    const A2HS_KEY = 'japan-toolbox-a2hs-dismissed';
    const ua = window.navigator.userAgent;
    const isIOS = /iPad|iPhone|iPod/.test(ua) || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
    const isSafari = /Safari/.test(ua) && !/CriOS|FxiOS|EdgiOS|OPiOS|LineApp|FBAN|FBAV|Instagram/.test(ua);
    const isStandalone = window.navigator.standalone === true || window.matchMedia('(display-mode: standalone)').matches;
    if (isIOS && isSafari && !isStandalone && !localStorage.getItem(A2HS_KEY)) {
      document.getElementById('a2hsBanner').classList.add('show');
    }
  })();
  function dismissA2HS() {
    localStorage.setItem('japan-toolbox-a2hs-dismissed', '1');
    document.getElementById('a2hsBanner').classList.remove('show');
  }
</script>
<script>
  // ── PWA：註冊 Service Worker（離線可用）──
  if ('serviceWorker' in navigator) {
    window.addEventListener('load', () => {
      navigator.serviceWorker.register('sw.js').catch(err => console.warn('SW 註冊失敗', err));
    });
  }
</script>
</body>
</html>
