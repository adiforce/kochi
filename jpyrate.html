<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>日幣換算 & 購物車</title>
<link href="https://fonts.googleapis.com/css2?family=Zen+Maru+Gothic:wght@400;700;900&family=Noto+Sans+TC:wght@400;700&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
<style>
  :root {
    --cream: #f3f5f8;
    --pink: #c9dcf0;
    --pink-dark: #2f6fb3;
    --mint: #b8e8d8;
    --mint-dark: #5abf9a;
    --yellow: #fce97a;
    --lavender: #d4c8f0;
    --brown: #1f3350;
    --text: #14233a;
    --muted: #5c708a;
    --border: #d6dee8;
    --surface: #ffffff;
    --red: #f87171;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

  body {
    font-family: 'Noto Sans TC', sans-serif;
    background: var(--cream);
    color: var(--text);
    min-height: 100vh;
  }

  body::before {
    content: '';
    position: fixed; inset: 0;
    background-image: radial-gradient(circle, #d3dbe6 1px, transparent 1px);
    background-size: 24px 24px;
    opacity: 0.45;
    pointer-events: none;
    z-index: 0;
  }

  .container {
    position: relative; z-index: 1;
    max-width: 480px;
    margin: 0 auto;
    padding: 20px 16px 60px;
  }

  .header { text-align: center; padding: 20px 0 18px; }
  .header h1 {
    font-family: 'Zen Maru Gothic', sans-serif;
    font-size: 22px; font-weight: 900; color: var(--brown);
  }
  .header-sub { font-size: 12px; color: var(--muted); margin-top: 4px; }

  .card {
    background: var(--surface);
    border-radius: 18px;
    padding: 16px 18px;
    margin-bottom: 14px;
    box-shadow: 0 3px 12px rgba(20,35,58,0.08);
    border: 2px solid var(--border);
  }

  .card-title {
    font-family: 'Zen Maru Gothic', sans-serif;
    font-size: 13px; font-weight: 900; color: var(--brown);
    margin-bottom: 14px;
    display: flex; align-items: center; gap: 6px;
  }

  /* ── 匯率顯示 ── */
  .rate-bar {
    display: flex; align-items: center; justify-content: space-between;
    background: #fef9ee; border-radius: 10px; padding: 10px 14px;
    margin-bottom: 14px; border: 1.5px solid var(--yellow);
  }
  .rate-label { font-size: 11px; color: var(--muted); font-weight: 700; }
  .rate-value {
    font-family: 'JetBrains Mono', monospace;
    font-size: 15px; font-weight: 700; color: var(--brown);
  }
  .rate-time { font-size: 10px; color: var(--muted); }
  .rate-refresh {
    padding: 5px 10px; border-radius: 8px;
    border: 1.5px solid var(--mint); background: white;
    font-size: 11px; color: var(--mint-dark); cursor: pointer;
    font-weight: 700; transition: all 0.15s;
  }
  .rate-refresh:hover { background: var(--mint); color: white; }
  .rate-refresh:disabled { opacity: 0.5; cursor: not-allowed; }

  /* ── 輸入 ── */
  .input-row {
    display: flex; gap: 10px; align-items: stretch;
    margin-bottom: 10px;
  }
  .input-group { flex: 1; position: relative; }
  .input-group label {
    font-size: 10px; font-weight: 700; color: var(--muted);
    display: block; margin-bottom: 4px; letter-spacing: 0.5px;
  }
  .input-group input {
    width: 100%; padding: 12px 14px;
    border: 1.5px solid var(--border); border-radius: 12px;
    font-size: 18px; font-weight: 700;
    font-family: 'JetBrains Mono', monospace;
    background: var(--cream); color: var(--brown);
    outline: none; transition: border-color 0.15s;
  }
  .input-group input:focus { border-color: var(--pink-dark); }
  .input-group input[readonly] {
    background: #f0fff8; border-color: var(--mint);
    color: var(--mint-dark);
  }
  .input-flag {
    position: absolute; right: 10px; bottom: 12px;
    font-size: 18px;
  }

  .arrow-mid {
    display: flex; align-items: flex-end; padding-bottom: 12px;
    font-size: 20px; color: var(--pink-dark);
  }

  /* ── 加入購物車按鈕 ── */
  .cart-btn {
    width: 100%; padding: 12px;
    background: var(--pink-dark); color: white;
    border: none; border-radius: 12px;
    font-size: 14px; font-weight: 700;
    font-family: 'Noto Sans TC', sans-serif;
    cursor: pointer; transition: opacity 0.15s;
    display: flex; align-items: center; justify-content: center; gap: 8px;
    margin-top: 10px;
  }
  .cart-btn:hover { opacity: 0.88; }
  .cart-btn:disabled { opacity: 0.4; cursor: not-allowed; }

  /* ── Modal ── */
  .modal-overlay {
    display: none; position: fixed; inset: 0; z-index: 100;
    background: rgba(20,35,58,0.35);
    align-items: flex-end; justify-content: center;
  }
  .modal-overlay.show { display: flex; }
  .modal {
    background: var(--surface); border-radius: 20px 20px 0 0;
    padding: 20px 18px 36px; width: 100%; max-width: 480px;
    animation: slideUp 0.25s ease;
  }
  @keyframes slideUp {
    from { transform: translateY(100%); }
    to { transform: translateY(0); }
  }
  .modal-title {
    font-family: 'Zen Maru Gothic', sans-serif;
    font-size: 16px; font-weight: 900; color: var(--brown);
    margin-bottom: 16px; text-align: center;
  }
  .modal-field { margin-bottom: 12px; }
  .modal-field label {
    font-size: 11px; font-weight: 700; color: var(--muted);
    display: block; margin-bottom: 4px;
  }
  .modal-field input[type="text"] {
    width: 100%; padding: 11px 14px;
    border: 1.5px solid var(--border); border-radius: 10px;
    font-size: 14px; font-family: 'Noto Sans TC', sans-serif;
    background: var(--cream); color: var(--text);
    outline: none; transition: border-color 0.15s;
  }
  .modal-field input[type="text"]:focus { border-color: var(--pink-dark); }

  .qty-row {
    display: flex; align-items: center; gap: 12px;
  }
  .qty-slider {
    flex: 1; -webkit-appearance: none; appearance: none;
    height: 6px; border-radius: 3px;
    background: linear-gradient(to right, var(--pink-dark) 0%, var(--border) 0%);
    outline: none;
  }
  .qty-slider::-webkit-slider-thumb {
    -webkit-appearance: none; appearance: none;
    width: 24px; height: 24px; border-radius: 50%;
    background: var(--pink-dark); cursor: pointer;
    box-shadow: 0 2px 6px rgba(0,0,0,0.2);
  }
  .qty-display {
    font-family: 'JetBrains Mono', monospace;
    font-size: 22px; font-weight: 700; color: var(--brown);
    min-width: 40px; text-align: center;
  }

  .modal-price-preview {
    background: #f9f3ff; border-radius: 10px; padding: 10px 14px;
    margin-bottom: 14px; border: 1.5px solid var(--lavender);
    font-size: 13px; color: var(--brown); line-height: 1.8;
    text-align: center;
  }

  .modal-btns { display: flex; gap: 10px; }
  .modal-cancel {
    flex: 1; padding: 12px;
    border: 2px solid var(--border); background: white;
    border-radius: 12px; font-size: 14px; font-weight: 700;
    color: var(--muted); cursor: pointer; font-family: 'Noto Sans TC', sans-serif;
    transition: all 0.15s;
  }
  .modal-cancel:hover { border-color: var(--pink); color: var(--pink-dark); }
  .modal-confirm {
    flex: 2; padding: 12px;
    background: var(--mint-dark); color: white;
    border: none; border-radius: 12px;
    font-size: 14px; font-weight: 700;
    font-family: 'Noto Sans TC', sans-serif;
    cursor: pointer; transition: opacity 0.15s;
  }
  .modal-confirm:hover { opacity: 0.88; }

  /* ── 購物清單 ── */
  .list-header {
    display: flex; align-items: center; justify-content: space-between;
    margin-bottom: 10px;
  }
  .clear-all-btn {
    padding: 5px 12px; border-radius: 8px;
    border: 1.5px solid var(--red);
    background: white; color: var(--red);
    font-size: 11px; font-weight: 700;
    cursor: pointer; font-family: 'Noto Sans TC', sans-serif;
    transition: all 0.15s;
  }
  .clear-all-btn:hover { background: var(--red); color: white; }

  .cart-item {
    background: var(--surface); border-radius: 12px;
    padding: 12px 14px; margin-bottom: 8px;
    border: 1.5px solid var(--border);
    display: flex; align-items: center; gap: 12px;
    animation: slideIn 0.2s ease;
  }
  @keyframes slideIn {
    from { opacity: 0; transform: translateY(-6px); }
    to { opacity: 1; transform: translateY(0); }
  }
  .cart-item-info { flex: 1; }
  .cart-item-name {
    font-family: 'Zen Maru Gothic', sans-serif;
    font-size: 14px; font-weight: 700; color: var(--brown);
    margin-bottom: 2px;
  }
  .cart-item-qty {
    font-size: 11px; color: var(--muted);
  }
  .cart-item-price {
    text-align: right;
  }
  .cart-item-jpy {
    font-family: 'JetBrains Mono', monospace;
    font-size: 14px; font-weight: 700; color: var(--brown);
  }
  .cart-item-twd {
    font-size: 10px; color: var(--muted); margin-top: 2px;
  }
  .cart-del-btn {
    width: 28px; height: 28px; border-radius: 50%;
    border: 1.5px solid var(--pink);
    background: white; color: var(--pink-dark);
    font-size: 13px; cursor: pointer;
    display: flex; align-items: center; justify-content: center;
    transition: all 0.15s; flex-shrink: 0;
  }
  .cart-del-btn:hover { background: var(--pink-dark); color: white; border-color: var(--pink-dark); }

  .cart-item.bought { background: #f0fff8; border-color: var(--mint); }
  .cart-item.bought .cart-item-name { color: var(--mint-dark); }
  .buy-check {
    appearance: none; -webkit-appearance: none;
    width: 22px; height: 22px; min-width: 22px; border-radius: 7px;
    border: 2px solid var(--mint-dark); background: white; cursor: pointer;
    position: relative; margin: 0;
  }
  .buy-check:checked { background: var(--mint-dark); }
  .buy-check:checked::after {
    content: ""; position: absolute; left: 6px; top: 2px;
    width: 5px; height: 10px; border: solid white; border-width: 0 2.5px 2.5px 0; transform: rotate(45deg);
  }
  .buy-check:disabled { opacity: .5; }
  .cart-item-tax { font-size: 11px; color: var(--mint-dark); margin-top: 3px; }
  .cart-item-lock { font-size: 10.5px; color: var(--mint-dark); font-weight: 700; margin-top: 3px; }
  .send-kakeibo {
    margin-top: 6px; padding: 4px 10px; border-radius: 8px;
    border: 1.5px solid var(--mint-dark); background: white; color: var(--mint-dark);
    font-size: 11px; font-weight: 700; cursor: pointer; font-family: inherit;
  }
  .send-kakeibo:disabled { opacity: 0.5; cursor: default; }

  .tax-hint { font-size: 11.5px; color: var(--muted); margin: -4px 0 10px; line-height: 1.5; }
  .tax-hint b { color: var(--mint-dark); }

  .empty-cart {
    text-align: center; color: var(--muted);
    font-size: 13px; padding: 24px 0;
  }
  .empty-icon { font-size: 32px; margin-bottom: 6px; }

  /* ── 加總 ── */
  .summary-card {
    background: var(--surface);
    border-radius: 18px; padding: 16px 18px;
    margin-top: 14px;
    border: 2px solid var(--mint);
    box-shadow: 0 3px 12px rgba(20,35,58,0.08);
  }
  .summary-row {
    display: flex; justify-content: space-between; align-items: center;
    padding: 6px 0; border-bottom: 1px dashed var(--border);
    font-size: 13px;
  }
  .summary-row:last-child { border-bottom: none; }
  .summary-row .label { color: var(--muted); font-weight: 600; }
  .summary-row .value {
    font-family: 'JetBrains Mono', monospace;
    font-weight: 700; color: var(--brown);
  }
  .summary-row.total .label { font-size: 14px; font-weight: 900; color: var(--brown); }
  .summary-row.total .value { font-size: 16px; color: var(--pink-dark); }
  .summary-row.tax { background: #f0fff8; border-radius: 6px; padding: 6px 8px; margin-top: 4px; }
  .summary-row.tax .label { color: var(--mint-dark); }
  .summary-row.tax .value { color: var(--mint-dark); }
</style>

<link rel="icon" type="image/png" sizes="32x32" href="favicon-32.png">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="theme-color" content="#2f6fb3">
</head>
<body>
<script src="doodle-icons.js"></script>
<script src="ryoma-guide.js"></script>
<script src="kakeibo-inbox.js"></script>
<div class="container">

  <div class="header">
    <h1>🛒 日幣換算 & 購物車</h1>
    <div class="header-sub">即時匯率・自動換算・退稅計算</div>
  </div>

  <!-- 匯率卡 -->
  <div class="card">
    <div class="card-title">💱 即時日幣匯率</div>
    <div class="rate-bar">
      <div>
        <div class="rate-label">1 JPY =</div>
        <div class="rate-value" id="rateDisplay">載入中...</div>
        <div class="rate-time" id="rateTime"></div>
      </div>
      <button class="rate-refresh" id="refreshBtn" onclick="fetchRate()">🔄 更新</button>
    </div>

    <!-- 換算 -->
    <div class="input-row">
      <div class="input-group">
        <label>輸入日幣 JPY（含稅價）</label>
        <input type="number" id="jpyInput" placeholder="0" inputmode="numeric" oninput="calcTWD()">
        <span class="input-flag">🇯🇵</span>
      </div>
      <div class="arrow-mid">→</div>
      <div class="input-group">
        <label>等值台幣 TWD</label>
        <input type="number" id="twdOutput" placeholder="0" readonly>
        <span class="input-flag">🇹🇼</span>
      </div>
    </div>

    <div class="tax-hint">請輸入標價上的<b>「税込」含稅價</b>；明細的稅額是從含稅價裡拆出來的。</div>

    <button class="cart-btn" id="addCartBtn" onclick="openModal()" disabled>
      🛍️ 加入購物車
    </button>
  </div>

  <!-- 購物清單 -->
  <div class="card">
    <div class="list-header">
      <div class="card-title" style="margin-bottom:0">🗒️ 待購清單</div>
      <button class="clear-all-btn" onclick="clearAll()">🗑️ 全部清除</button>
    </div>
    <div data-rg-hint="買了就勾「已購買」，下面會出現「📥 送記帳暫存」；送過去後到家計簿的「暫存」頁籤補類別，就能入檔！"></div>
    <div id="cartList"></div>
  </div>

  <!-- 加總 -->
  <div class="summary-card" id="summaryCard">
    <div class="summary-row">
      <span class="label">商品項目</span>
      <span class="value" id="sumItems">0 項</span>
    </div>
    <div class="summary-row total">
      <span class="label">💴 合計（JPY）</span>
      <span class="value" id="sumJpy">¥0</span>
    </div>
    <div class="summary-row total">
      <span class="label">💵 合計（TWD）</span>
      <span class="value" id="sumTwd">NT$0</span>
    </div>
    <div class="summary-row">
      <span class="label">✅ 已購買（購買當下匯率）</span>
      <span class="value" id="sumBought">NT$0</span>
    </div>
    <div class="summary-row">
      <span class="label">🛒 未購買（即時匯率）</span>
      <span class="value" id="sumPending">NT$0</span>
    </div>
  </div>

</div>

<!-- Modal -->
<div class="modal-overlay" id="modalOverlay">
  <div class="modal">
    <div class="modal-title">🛍️ 加入購物車</div>

    <div class="modal-field">
      <label>項目名稱</label>
      <input type="text" id="modalItemName" placeholder="例：ASICS 球鞋、DHC 藍莓...">
    </div>

    <div class="modal-field">
      <label>數量：<span id="qtyVal">1</span> 個</label>
      <div class="qty-row">
        <input type="range" class="qty-slider" id="qtySlider" min="1" max="20" value="1" oninput="updateQty()">
        <div class="qty-display" id="qtyDisplay">1</div>
      </div>
    </div>

    <div class="modal-price-preview" id="modalPreview">
      ¥0 × 1 個 = ¥0<br>
      ≈ NT$0
    </div>

    <div class="modal-btns">
      <button class="modal-cancel" onclick="closeModal()">取消</button>
      <button class="modal-confirm" onclick="addToCart()">✅ 加入</button>
    </div>
  </div>
</div>

<script>
  const CART_KEY = 'jpy_cart_v1';
  const RATE_KEY = 'jpy_rate_v1';
  let cart = [];
  let currentRate = 0;
  let pendingJpy = 0;
  let rateTs = 0;

  // ── 初始化 ──
  function init() {
    const saved = localStorage.getItem(CART_KEY);
    if (saved) cart = JSON.parse(saved);

    const savedRate = localStorage.getItem(RATE_KEY);
    if (savedRate) {
      const r = JSON.parse(savedRate);
      currentRate = r.rate;
      rateTs = r.ts || 0;
      document.getElementById('rateDisplay').textContent = `NT$ ${r.rate.toFixed(4)}`;
      document.getElementById('rateTime').textContent = `更新：${r.time}`;
    }

    fetchRate();
    renderCart();
  }

  // ── 取得即時匯率 ──
  async function fetchRate() {
    const btn = document.getElementById('refreshBtn');
    btn.disabled = true;
    btn.textContent = '⏳';

    // 三個備用來源，都是同一個資料庫的 CDN
    const urls = [
      'https://cdn.jsdelivr.net/npm/@fawazahmed0/currency-api@latest/v1/currencies/jpy.min.json',
      'https://latest.currency-api.pages.dev/v1/currencies/jpy.min.json',
      'https://cdn.jsdelivr.net/npm/@fawazahmed0/currency-api@latest/v1/currencies/jpy.json',
    ];

    let success = false;
    for (const url of urls) {
      try {
        const res = await fetch(url);
        const data = await res.json();
        const rate = data.jpy?.twd;
        if (!rate) continue;

        currentRate = rate;
        const now = new Date().toLocaleString('zh-TW', { hour12: false });
        document.getElementById('rateDisplay').textContent = `NT$ ${rate.toFixed(4)}`;
        document.getElementById('rateTime').textContent = `更新：${now}`;
        rateTs = Date.now();
        localStorage.setItem(RATE_KEY, JSON.stringify({ rate, time: now, ts: rateTs }));
        calcTWD();
        renderCart();
        success = true;
        break;
      } catch (e) {
        continue;
      }
    }

    if (!success && !currentRate) {
      document.getElementById('rateDisplay').textContent = '載入失敗，請重試';
    }

    btn.disabled = false;
    btn.textContent = '🔄 更新';
  }

  // ── 計算台幣 ──
  function calcTWD() {
    const jpy = parseFloat(document.getElementById('jpyInput').value) || 0;
    const twd = jpy * currentRate;
    document.getElementById('twdOutput').value = twd > 0 ? Math.round(twd) : '';
    document.getElementById('addCartBtn').disabled = jpy <= 0;
    pendingJpy = jpy;
    updateModalPreview();
  }

  // ── Modal ──
  function openModal() {
    document.getElementById('modalItemName').value = '';
    document.getElementById('qtySlider').value = 1;
    document.getElementById('qtyDisplay').textContent = 1;
    document.getElementById('qtyVal').textContent = 1;
    updateModalPreview();
    document.getElementById('modalOverlay').classList.add('show');
    setTimeout(() => document.getElementById('modalItemName').focus(), 300);
  }

  function closeModal() {
    document.getElementById('modalOverlay').classList.remove('show');
  }

  function updateQty() {
    const qty = parseInt(document.getElementById('qtySlider').value);
    document.getElementById('qtyDisplay').textContent = qty;
    document.getElementById('qtyVal').textContent = qty;

    // 更新 slider 漸層
    const slider = document.getElementById('qtySlider');
    const pct = ((qty - 1) / 19) * 100;
    slider.style.background = `linear-gradient(to right, var(--pink-dark) ${pct}%, var(--border) ${pct}%)`;

    updateModalPreview();
  }

  function updateModalPreview() {
    const qty = parseInt(document.getElementById('qtySlider')?.value || 1);
    const totalJpy = pendingJpy * qty;
    const totalTwd = Math.round(totalJpy * currentRate);
    document.getElementById('modalPreview').innerHTML =
      `¥${fmt(pendingJpy)} × ${qty} 個 = <strong>¥${fmt(totalJpy)}</strong><br>≈ <strong>NT$${fmt(totalTwd)}</strong>`;
  }

  function addToCart() {
    const name = document.getElementById('modalItemName').value.trim() || '未命名商品';
    const qty = parseInt(document.getElementById('qtySlider').value);
    const unitJpy = pendingJpy;
    const totalJpy = unitJpy * qty;
    const totalTwd = Math.round(totalJpy * currentRate);

    cart.unshift({
      id: Date.now(),
      name,
      qty,
      unitJpy,
      totalJpy,
      totalTwd
    });

    localStorage.setItem(CART_KEY, JSON.stringify(cart));
    closeModal();
    renderCart();

    // 清空輸入
    document.getElementById('jpyInput').value = '';
    document.getElementById('twdOutput').value = '';
    document.getElementById('addCartBtn').disabled = true;
    pendingJpy = 0;
  }

  // ── 渲染清單 ──
  function renderCart() {
    const el = document.getElementById('cartList');

    if (!cart.length) {
      el.innerHTML = '<div class="empty-cart"><div class="empty-icon">🛒</div>清單是空的</div>';
      updateSummary();
      return;
    }

    el.innerHTML = cart.map((item, i) => {
      const twd = itemTwd(item);
      const tax10 = Math.round(item.totalJpy * 10 / 110);
      const tax8  = Math.round(item.totalJpy * 8 / 108);
      const lock = item.bought
        ? `<div class="cart-item-lock">已購買・${item.boughtAt}・匯率 ${item.lockRate.toFixed(4)} 已鎖定</div>
           <button class="send-kakeibo" onclick="sendToKakeibo(${i})">${item.sentToKakeibo ? '✅ 已送暫存・再送' : '📥 送記帳暫存'}</button>` : '';
      return `
      <div class="cart-item${item.bought ? ' bought' : ''}">
        <input type="checkbox" class="buy-check" ${item.bought ? 'checked' : ''} onchange="toggleBought(${i}, this)" title="已購買" aria-label="已購買">
        <div class="cart-item-info">
          <div class="cart-item-name">${esc(item.name)}</div>
          <div class="cart-item-qty">¥${fmt(item.unitJpy)} × ${item.qty} 個</div>
          <div class="cart-item-tax">內含稅 ¥${fmt(tax10)}（10%）・食品 ¥${fmt(tax8)}（8%）</div>
          ${lock}
        </div>
        <div class="cart-item-price">
          <div class="cart-item-jpy">¥${fmt(item.totalJpy)}</div>
          <div class="cart-item-twd">≈ NT$${fmt(twd)}</div>
        </div>
        <button class="cart-del-btn" onclick="deleteItem(${i})">✕</button>
      </div>`;
    }).join('');

    updateSummary();
  }

  // 已購買：鎖定購買當下的匯率；未購買：跟著即時匯率
  function itemTwd(item) {
    if (item.bought) return item.lockTwd;
    return currentRate ? Math.round(item.totalJpy * currentRate) : item.totalTwd;
  }

  async function toggleBought(index, el) {
    const item = cart[index];
    if (!item) return;
    if (el.checked) {
      el.disabled = true;
      // 匯率超過 10 分鐘沒更新，先抓一次最新的再鎖定
      if (!currentRate || Date.now() - rateTs > 10 * 60 * 1000) await fetchRate();
      if (!currentRate) { el.checked = false; el.disabled = false; alert('抓不到匯率，請稍後再試'); return; }
      item.bought = true;
      item.lockRate = currentRate;
      item.lockTwd = Math.round(item.totalJpy * currentRate);
      item.boughtTs = Date.now();
      item.boughtAt = new Date().toLocaleString('zh-TW', { month: 'numeric', day: 'numeric', hour: '2-digit', minute: '2-digit', hour12: false });
    } else {
      item.bought = false;
      delete item.lockRate; delete item.lockTwd; delete item.boughtAt; delete item.boughtTs;
    }
    localStorage.setItem(CART_KEY, JSON.stringify(cart));
    renderCart();
  }

  // 已購買的商品送到家計簿「暫存」頁籤，補完類別、付款工具再入檔
  function sendToKakeibo(index) {
    const item = cart[index];
    if (!item || !item.bought) return;
    const srcId = 'cart-' + item.id;
    if (KakeiboInbox.has(srcId)) {
      if (!confirm('這筆還在家計簿暫存裡，確定要再送一筆？')) return;
    } else if (item.sentToKakeibo) {
      if (!confirm('這筆之前送過暫存（可能已經入檔），確定要再送一次？')) return;
    }
    let date = '';
    if (item.boughtTs) {
      const d = new Date(item.boughtTs);
      date = `${d.getMonth() + 1}/${d.getDate()}`;
    } else {
      const m = String(item.boughtAt || '').match(/(\d{1,2})\/(\d{1,2})/);
      const d = new Date();
      date = m ? `${+m[1]}/${+m[2]}` : `${d.getMonth() + 1}/${d.getDate()}`;
    }
    const ok = KakeiboInbox.push({
      src: 'cart',
      srcId,
      date,
      name: item.qty > 1 ? `${item.name} ×${item.qty}` : item.name,
      jpy: item.totalJpy,
    }, true);
    item.sentToKakeibo = true;
    localStorage.setItem(CART_KEY, JSON.stringify(cart));
    renderCart();
    if (ok) alert('已送到家計簿「暫存」頁籤，補完類別和付款工具再入檔');
  }

  function esc(s) {
    return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
  }

  function deleteItem(index) {
    cart.splice(index, 1);
    localStorage.setItem(CART_KEY, JSON.stringify(cart));
    renderCart();
  }

  function clearAll() {
    if (!cart.length) return;
    cart = [];
    localStorage.setItem(CART_KEY, JSON.stringify(cart));
    renderCart();
  }

  function updateSummary() {
    const totalItems = cart.length;
    const totalJpy = cart.reduce((s, i) => s + i.totalJpy, 0);
    const bought = cart.filter(i => i.bought).reduce((s, i) => s + itemTwd(i), 0);
    const pending = cart.filter(i => !i.bought).reduce((s, i) => s + itemTwd(i), 0);

    document.getElementById('sumItems').textContent = `${totalItems} 項（已買 ${cart.filter(i => i.bought).length}）`;
    document.getElementById('sumJpy').textContent = `¥${fmt(totalJpy)}`;
    document.getElementById('sumTwd').textContent = `NT$${fmt(bought + pending)}`;
    document.getElementById('sumBought').textContent = `NT$${fmt(bought)}`;
    document.getElementById('sumPending').textContent = `NT$${fmt(pending)}`;
  }

  function fmt(n) {
    return Math.round(n).toLocaleString('zh-TW');
  }

  // 點 overlay 關閉 modal
  document.getElementById('modalOverlay').addEventListener('click', function(e) {
    if (e.target === this) closeModal();
  });

  init();
</script>
</body>
</html>
